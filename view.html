<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1626" />
  <title>Cámara en vivo · Ecuador 1438</title>
  <link rel="stylesheet" href="CSS/sfu.css" />
</head>

<body class="sfu-body sfu-viewer">
  <main id="stage" class="sfu-stage">
    <!-- Cuadro superior: la cámara de la puerta (remoto) -->
    <div id="remote-pane" class="sfu-pane sfu-pane-remote">
      <video id="remote-video" class="sfu-video" autoplay playsinline muted></video>

      <!-- Portada de espera -->
      <div id="cover" class="sfu-cover">
        <div id="spinner" class="sfu-spinner"></div>
        <div class="sfu-cover-icon">🎦</div>
        <p id="cover-text">Conectando…</p>
      </div>

      <!-- Píldora EN VIVO (arriba, centrada) -->
      <div id="live-pill" class="sfu-pill sfu-pill-live is-hidden">
        <span class="sfu-pill-dot" aria-hidden="true"></span>
        <span>En vivo</span>
      </div>
    </div>

    <!-- Cuadro inferior: tu propia cámara (local, al contestar) -->
    <div id="local-pane" class="sfu-pane sfu-pane-local is-hidden">
      <video id="local-video" class="sfu-video" autoplay playsinline muted></video>
      <span class="sfu-pane-tag">Tú</span>
      <span id="local-connecting" class="sfu-pane-note">Activando tu cámara…</span>
    </div>
  </main>

  <!-- Controles inferiores -->
  <div id="controls" class="sfu-controls">
    <button id="btn-sound" class="sfu-ctl" type="button"
      aria-label="Activar o silenciar el audio de la puerta">🔇</button>

    <!-- Contestación de la llamada (visor) -->
    <div class="sfu-controls-center">
      <button id="btn-answer" class="sfu-answer" type="button" aria-label="Contestar con tu cámara">
        <svg class="sfu-answer-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M4 6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h5l7 3.5V2.5L9 6H4z" />
          <circle cx="17" cy="12" r="2.6" />
          <path d="M18 8.2a4.2 4.2 0 0 1 0 7.6" stroke="#fff" stroke-width="1.6" fill="none"
            stroke-linecap="round" />
        </svg>
        Contestar
      </button>

      <button id="btn-mic" class="sfu-ctl is-hidden" type="button" aria-pressed="false"
        aria-label="Silenciar tu micrófono">
        <svg class="sfu-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path class="sfu-mic-body"
            d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" />
          <path class="sfu-mic-stand" d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2M8.8 21.2h6.4" />
          <g class="sfu-mic-slash">
            <line class="sfu-mic-slash-halo" x1="5" y1="19.5" x2="19" y2="4.5" />
            <line class="sfu-mic-slash-line" x1="5" y1="19.5" x2="19" y2="4.5" />
          </g>
        </svg>
      </button>
      <button id="btn-hangup" class="sfu-hangup is-hidden" type="button"
        aria-label="Finalizar la llamada">Finalizar</button>
    </div>

    <button id="btn-full" class="sfu-ctl" type="button" aria-label="Pantalla completa">⛶</button>
  </div>

  <div id="error-box" class="sfu-error is-hidden"></div>

  <!-- Capa local de control de tiempo (JS/time-gate.js) -->
  <div id="tg-clock" class="tg-clock tg-left is-hidden" role="timer"
    aria-label="Tiempo restante de visualización">
    <span class="tg-clock-icon" aria-hidden="true">⏱</span>
    <span class="tg-clock-value">02:00</span>
  </div>

  <script src="JS/sfu.js"></script>
  <script src="JS/time-gate.js"></script>
  <script>
    (function () {
      'use strict';

      var stage = document.getElementById('stage');
      var localPane = document.getElementById('local-pane');
      var video = document.getElementById('remote-video');
      var localVideo = document.getElementById('local-video');
      var localConnecting = document.getElementById('local-connecting');
      var cover = document.getElementById('cover');
      var coverText = document.getElementById('cover-text');
      var spinner = document.getElementById('spinner');
      var livePill = document.getElementById('live-pill');
      var soundBtn = document.getElementById('btn-sound');
      var answerBtn = document.getElementById('btn-answer');
      var micBtn = document.getElementById('btn-mic');
      var hangupBtn = document.getElementById('btn-hangup');
      var fullBtn = document.getElementById('btn-full');
      var errorBox = document.getElementById('error-box');

      var controller = null;   // SFU.watch (recibe la cámara de la puerta)
      var returnCtrl = null;   // SFU.broadcast (tu cámara hacia la puerta)
      var localStream = null;  // cámara/mic local del visor
      var returnSession = '';  // sesión de retorno publicada en el SFU
      var watchSession = '';   // sesión de la puerta a la que estamos enganchados
      var repointTimer = null; // vigilancia de reconexión de la puerta
      var micOn = true;
      var answering = false;

      var params = SFU.parseViewParams(location.search);

      function setCoverText(text, showSpinner) {
        coverText.textContent = text;
        if (showSpinner === false) spinner.classList.add('is-hidden');
        else spinner.classList.remove('is-hidden');
      }

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.classList.remove('is-hidden');
        setCoverText(msg, false);
      }

      function hideError() {
        errorBox.classList.add('is-hidden');
        errorBox.textContent = '';
      }

      function setStatus(s) {
        // Agotado el tiempo, ningún estado posterior (una reconexión que
        // llegara tarde, un 'live' rezagado) puede volver a tapar el aviso
        // de "Tiempo de visualización finalizado".
        if (finalizada) return;
        if (s === 'live') {
          cover.classList.add('is-hidden');
          livePill.classList.remove('is-hidden');
        } else if (s === 'connecting') {
          cover.classList.remove('is-hidden');
          livePill.classList.add('is-hidden');
          setCoverText('Conectando…', true);
        } else if (s === 'waiting') {
          cover.classList.remove('is-hidden');
          livePill.classList.add('is-hidden');
          setCoverText('Esperando que se encienda la cámara…', true);
        } else if (s === 'reconnecting') {
          cover.classList.remove('is-hidden');
          livePill.classList.add('is-hidden');
          setCoverText('Conexión perdida. Reconectando…', true);
        }
      }

      function setControlsCallMode(active) {
        answerBtn.classList.toggle('is-hidden', active);
        micBtn.classList.toggle('is-hidden', !active);
        hangupBtn.classList.toggle('is-hidden', !active);
        stage.classList.toggle('has-call', active);
      }

      // El icono es siempre un micrófono: al silenciar se le añade la
      // tachadura roja (lo aporta la clase .is-muted en sfu.css). Antes
      // se cambiaba el texto del botón por 🔇, que es el icono de Bocina
      // apagada y no de micrófono silenciado.
      function setMicMuted(muted) {
        micBtn.classList.toggle('is-muted', muted);
        micBtn.setAttribute('aria-pressed', muted ? 'true' : 'false');
        micBtn.setAttribute('aria-label',
          muted ? 'Activar tu micrófono' : 'Silenciar tu micrófono');
      }

      function toggleMic() {
        if (!localStream) return;
        var audio = localStream.getAudioTracks()[0];
        if (!audio) return;
        micOn = !micOn;
        audio.enabled = micOn;
        setMicMuted(!micOn);
      }

      // Cámara + micro. Si el micrófono no se concede, se publica solo
      // el video: antes se pedía audio junto al video y el rechazo del
      // micro tumbaba también el video, dejando la puerta sin respuesta.
      function requestLocalMedia() {
        var videoConst = {
          facingMode: 'user',
          width: { ideal: 1280 },
          height: { ideal: 720 },
        };
        return navigator.mediaDevices
          .getUserMedia({ audio: true, video: videoConst })
          .catch(function () {
            return navigator.mediaDevices.getUserMedia({ video: videoConst });
          });
      }

      function setReturnNote(text, show) {
        if (!localConnecting) return;
        localConnecting.textContent = text || '';
        if (show) localConnecting.classList.remove('is-hidden');
        else localConnecting.classList.add('is-hidden');
      }

      // Publica tu cámara/mic hacia el SFU (WHIP) en una sesión de
      // retorno independiente; la puerta la jala (WHEP).
      function startReturnBroadcast(videoTrack, audioTrack) {
        returnCtrl = SFU.broadcast({
          videoTrack: videoTrack,
          audioTrack: audioTrack,
          door: params.door || '',
          silent: true,
          waitReturn: false,
          // Este emisor publica su stream como retorno de la puerta.
          announceReturn: true,
          // Si el registro se pierde, la puerta lo redescubre sola.
          pairHeartbeatMs: 15000,
          onStatus: function (s) {
            if (s === 'connecting') {
              setReturnNote('Enviando tu respuesta…', true);
            } else if (s === 'live') {
              if (returnSession) setReturnNote('', false);
            } else if (s === 'reconnecting') {
              setReturnNote('Reconectando tu respuesta…', true);
            }
          },
          onLive: function (info) {
            if (!info.sessionId || !params.door) return;
            returnSession = info.sessionId;
            // Se registran los nombres de pista que aceptó el SFU, no
            // los supuestos: si no hay micro, la puerta solo pedirá
            // video en vez de fallar la negociación entera.
            setReturnNote('Avisando a la puerta…', true);
            SFU.registerReturnReliable(params.door, info.sessionId, info.trackNames)
              .then(function () {
                setReturnNote('Respuesta enviada', true);
                setTimeout(function () {
                  if (returnSession === info.sessionId) setReturnNote('', false);
                }, 1200);
              })
              .catch(function (err) {
                console.warn('No se pudo registrar el retorno de la llamada', err);
                setReturnNote('Sin respuesta de la puerta', true);
              });
          },
          onFail: function (err) {
            console.error('SFU return broadcast error', err);
          },
        });
      }

      function startAnswer() {
        if (answering) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          showError('Tu navegador no permite usar la cámara. Necesitas una conexión HTTPS.');
          return;
        }
        if (!params.session) return;

        answering = true;
        hideError();
        answerBtn.disabled = true;

        requestLocalMedia()
          .then(function (stream) {
            localStream = stream;
            localVideo.srcObject = stream;
            localVideo.play().catch(function () {});
            localConnecting.classList.add('is-hidden');
            localPane.classList.remove('is-hidden');
            setControlsCallMode(true);
            answerBtn.disabled = false;
            localVideo.style.visibility = 'visible';

            if (!params.door) {
              // Sin identificador de puerta nadie puede jalar el
              // retorno: es mejor decirlo que dejar al usuario
              // pensando que sí.
              setReturnNote('Enlace sin puerta: tu respuesta no podrá verse.', true);
              return;
            }

            startReturnBroadcast(stream.getVideoTracks()[0], stream.getAudioTracks()[0]);
          })
          .catch(function (err) {
            console.error('Error de permisos/media local', err);
            answering = false;
            answerBtn.disabled = false;
            showError('No se pudo activar tu cámara. Revisa los permisos del navegador.');
          });
      }

      function stopAnswer() {
        answering = false;
        if (returnCtrl) {
          returnCtrl.stop();
          returnCtrl = null;
        }
        if (params.door && returnSession) {
          // Se manda la sesión para no tumbar la llamada de otro
          // visor que ya haya tomado el relevo.
          SFU.clearReturn(params.door, returnSession).catch(function () {});
        }
        returnSession = '';
        if (localStream) {
          localStream.getTracks().forEach(function (t) { t.stop(); });
          localStream = null;
        }
        localVideo.srcObject = null;
        localPane.classList.add('is-hidden');
        setControlsCallMode(false);
        micOn = true;
        setMicMuted(false);
      }

      // ── Re-apuntado a la sesión vigente de la puerta ──
      // Si la puerta reconecta crea una sesión nueva y el enlace
      // recibido en la URL queda viejo. Se consulta /stream-status y
      // se cambia el watch para no quedarse con un cuadro congelado.
      function startWatch(session, tracks) {
        if (finalizada) return;   // el tiempo de visualización ya se agotó
        if (controller) {
          controller.stop();
          controller = null;
        }
        watchSession = session;
        controller = SFU.watch({
          session: session,
          tracks: tracks,
          videoEl: video,
          onStatus: setStatus,
          onLive: function () {},
          onFail: function (err) {
            console.error('SFU watch error', err);
          },
        });
      }

      function watchRepoint() {
        repointTimer = setTimeout(function () {
          if (!params.door || !params.session) return;
          SFU.getStreamStatus(params.door)
            .then(function (st) {
              if (!st || !st.streamSession) return;
              if (st.streamSession === watchSession) return;
              // La puerta cambió de sesión: seguimos a la nueva.
              var names = (st.streamTracks && st.streamTracks.length) ? st.streamTracks : null;
              var tracks = names
                ? names.map(function (name) {
                    return {
                      trackName: name,
                      kind: /audio|mic|sonido/i.test(name) ? 'audio' : 'video',
                    };
                  })
                : params.tracks;
              startWatch(st.streamSession, tracks);
            })
            .catch(function () {})
            .then(function () { watchRepoint(); });
        }, 6000);
      }

      /* ═══════════════════════════════════════════════
         Capa local de control de tiempo · VISOR (receptor)
         ───────────────────────────────────────────────
         Cuenta de 2 minutos DEL VISOR, independiente: no
         sabe nada de la puerta y no le dice nada a la
         puerta. Al agotarse solo se apaga el reproductor
         local de este navegador.

         El cronómetro arranca con el primer 'play' o
         'loadedmetadata' del <video> (o de inmediato, si
         el video ya llegó reproduciéndose). Los eventos
         posteriores NO lo reinician: si el stream se
         reconecta, la cuenta sigue donde iba, porque es
         tiempo de visualización, no tiempo de conexión.
         ═══════════════════════════════════════════════ */
      var clockEl = document.getElementById('tg-clock');
      var reloj = window.TimeGate && clockEl
        ? window.TimeGate.create(clockEl, { onEnd: finalizarVisualizacion })
        : null;
      var arrancado = false;
      var finalizada = false;   // ¿ya se agotó el tiempo de visualización?

      function arrancarReloj() {
        if (arrancado || !reloj) return;
        arrancado = true;
        reloj.start(TimeGate.LIMITE_MS);
      }

      function finalizarVisualizacion() {
        if (finalizada) return;
        finalizada = true;
        if (reloj) reloj.hide();

        // Se detiene la vigilancia de reconexión: la cuenta terminó y no
        // tiene sentido reengancharse a una sesión nueva. Es un temporizador
        // local, no una llamada al emisor.
        if (repointTimer) { clearTimeout(repointTimer); repointTimer = null; }

        // Cierre de la PeerConnection PROPIA de este visor. SFU.watch.stop()
        // solo marca running=false y hace pc.close(): no envía ningún mensaje
        // ni peticiones al emisor, pero evita que SFU.watch vuelva a attaches
        // un stream nuevo al <video> y lo resucite.
        if (controller) {
          controller.stop();
          controller = null;
        }

        // Limpieza local del reproductor: sin esto el navegador conserva el
        // último fotograma decodificado y la imagen se queda congelada.
        var remoto = video.srcObject;
        if (remoto && remoto.getTracks) {
          remoto.getTracks().forEach(function (t) { t.stop(); });
        }
        try { video.pause(); } catch (e) {}
        video.srcObject = null;
        video.removeAttribute('src');
        try { video.load(); } catch (e) {}

        hideError();
        livePill.classList.add('is-hidden');
        cover.classList.remove('is-hidden');
        setCoverText('Tiempo de visualización finalizado', false);
      }

      video.addEventListener('play', arrancarReloj, { once: true });
      video.addEventListener('loadedmetadata', arrancarReloj, { once: true });
      // Si el script se cargó con el video ya en marcha, no se espera
      // a otro evento que quizá no vuelva a llegar.
      if (video.readyState >= 2) arrancarReloj();

      // Enlace sin sesión → inválido
      if (!params.session) {
        showError('Enlace no válido. Falta el identificador de la transmisión.');
        return;
      }

      startWatch(params.session, params.tracks);
      watchRepoint();

      // Audio de la puerta (activar/silenciar)
      soundBtn.addEventListener('click', function () {
        video.muted = !video.muted;
        soundBtn.textContent = video.muted ? '🔇' : '🔊';
      });

      answerBtn.addEventListener('click', startAnswer);
      micBtn.addEventListener('click', toggleMic);
      hangupBtn.addEventListener('click', stopAnswer);

      fullBtn.addEventListener('click', function () {
        if (stage.requestFullscreen) {
          if (document.fullscreenElement) document.exitFullscreen();
          else stage.requestFullscreen().catch(function () {});
        }
      });

      window.addEventListener('beforeunload', function () {
        if (repointTimer) { clearTimeout(repointTimer); repointTimer = null; }
        if (controller) controller.stop();
        stopAnswer();
      });
    })();
  </script>
</body>

</html>
