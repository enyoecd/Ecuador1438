<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Puerta 2 - Ecuador 1438</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style data-purpose="custom-colors">
    :root {
      --bg-stadium: #1a202c;
      --card-bg: #2d3748;
      --input-bg: #ffffff;
      --button-bg: #f05252;
      --text-label: #a0aec0;
      --text-white: #ffffff;
    }

    body {
      background-color: #1a2a3a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .door-avatar-pulse {
      position: relative;
      isolation: isolate;
    }

    .door-avatar-pulse::after {
      content: "";
      position: absolute;
      inset: -4px;
      z-index: -1;
      border: 2px solid #f05252;
      border-radius: 9999px;
      background: rgb(240 82 82 / 12%);
      box-shadow: 0 0 0 1px rgb(255 255 255 / 30%), 0 0 14px #f05252;
      pointer-events: none;
      animation: door-avatar-pulse 2.4s ease-in-out infinite;
    }

    @keyframes door-avatar-pulse {

      0%,
      100% {
        opacity: .5;
        transform: scale(1);
      }

      50% {
        opacity: .95;
        transform: scale(1.09);
      }
    }

    /* Modal Timbre styling */
    .timbre-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
      padding: 16px;
    }

    .timbre-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .timbre-modal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 36px;
      border-radius: 1.5rem;
      background: #2d3748;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transform: scale(0.85);
      transition: transform 220ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 280px;
      width: 100%;
      border: 2px solid #f05252;
      background: linear-gradient(145deg, #2d191e, #1a0f12);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(240, 82, 82, 0.3);
    }

    .timbre-modal.active .timbre-modal-card {
      transform: scale(1);
    }

    .timbre-bell-icon {
      font-size: 3.2rem;
      line-height: 1;
      display: inline-block;
      transform-origin: top center;
    }

    .timbre-modal.active .timbre-bell-icon {
      animation: bell-ring 0.55s ease-in-out infinite alternate;
    }

    .timbre-modal-text {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffe4e6;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @keyframes bell-ring {
      0% {
        transform: rotate(-24deg);
      }

      100% {
        transform: rotate(24deg);
      }
    }

    /* Modal Mensaje Enviado */
    .msg-modal-card {
      max-width: 300px;
      padding: 24px 32px;
    }

    .msg-modal-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .msg-plane-icon {
      width: 2.2rem;
      height: 2.2rem;
      color: #f05252;
      display: inline-block;
      flex-shrink: 0;
    }

    .timbre-modal.active .msg-plane-icon {
      animation: paper-plane-fly 1.4s ease-in-out infinite alternate;
    }

    .msg-modal-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffe4e6;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    @keyframes paper-plane-fly {
      0% {
        transform: translate(-8px, 6px) scale(0.85);
        opacity: 0.7;
      }

      50% {
        transform: translate(4px, -4px) scale(1.08);
        opacity: 1;
      }

      100% {
        transform: translate(10px, -10px) scale(1.02);
        opacity: 0.95;
      }
    }

    /* Modal Aviso Límite Timbre */
    .timbre-limit-card {
      max-width: 250px;
      width: 85%;
      padding: 14px 18px;
      border-radius: 1.25rem;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1.5px solid #f59e0b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
    }

    .timbre-limit-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .timbre-limit-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      flex-shrink: 0;
    }

    .timbre-limit-icon svg {
      width: 15px;
      height: 15px;
      stroke: #fbbf24;
    }

    .timbre-limit-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .timbre-limit-text {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.35;
    }

    #btn-timbre-p2.timbre-locked, #btn-timbre-p2.timbre-disabled {
      opacity: 0.55;
      filter: grayscale(0.5);
      cursor: pointer;
    }

    #btn-timbre-p2.timbre-locked:hover, #btn-timbre-p2.timbre-disabled:hover {
      opacity: 0.75;
      filter: grayscale(0.2);
    }

    /* Modal Ampliar Imagen styling */
    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 280ms ease, visibility 280ms ease;
      padding: 16px;
      cursor: pointer;
    }

    .image-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .image-modal-card {
      position: relative;
      max-width: min(88vw, 420px);
      max-height: 75vh;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 2px solid #f05252;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(240, 82, 82, 0.35);
      transform: scale(0.7);
      transition: transform 280ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #1a2a3a;
    }

    .image-modal.active .image-modal-card {
      transform: scale(1);
    }

    .image-modal-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
    }

    .image-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: rgba(26, 42, 58, 0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      z-index: 10;
      transition: background 180ms ease;
    }

    .image-modal-close:hover {
      background: #f05252;
      color: #fff;
    }

    .door-avatar-pulse {
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .door-avatar-pulse:hover {
      transform: scale(1.05);
    }

    @media (prefers-reduced-motion: reduce) {
      .door-avatar-pulse::after {
        animation: none;
      }

      .image-modal-card {
        transition: none;
      }
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">
  <!-- BEGIN: MainContactCard -->
  <main class="w-full max-w-sm max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-[2.5rem] relative shadow-2xl"
    style="background-color: var(--card-bg);">
    <!-- Header Section with Icon -->
    <div class="relative pt-20 pb-3 flex flex-col items-center">
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between">
        <button aria-label="Regresar a la página anterior"
          class="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl border border-red-300/40 bg-[#f05252] px-3.5 py-1.5 text-sm font-semibold text-white shadow-lg transition duration-200 ease-in-out hover:-translate-x-0.5 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-[#f05252] focus:ring-offset-2 focus:ring-offset-[#2d3748] active:translate-x-0"
          onclick="window.history.back()" type="button">
          <svg class="w-4 h-4 text-[#4c0519] stroke-[2.75] shrink-0" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
          </svg>
          <span class="leading-none">Regresar</span>
        </button>
        <button id="btn-timbre-p2"
          class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-red-300/60 bg-[#f05252]/15 px-3.5 py-1.5 text-sm font-bold text-[#f05252] shadow-lg transition duration-200 ease-in-out hover:bg-[#f05252] hover:text-white focus:outline-none active:scale-95"
          type="button">
          <span>🔔</span>
          <span>Timbre</span>
        </button>
      </div>
      <div id="door-avatar" class="door-avatar-pulse w-20 h-20 shrink-0 mt-2" role="button"
        aria-label="Ampliar imagen Puerta 2" tabindex="0">
        <div
          class="overflow-hidden rounded-full shadow-lg flex items-center justify-center w-full h-full border-4 border-[#1a2a3a]">
          <img alt="Puerta 2" class="w-full h-full object-cover" src="imagenes/puerta2.jpeg" />
        </div>
      </div>
      <h2 class="text-lg font-bold mt-2 text-red-400">Puerta 2 - Ecuador 1438</h2>
    </div>

    <!-- Form Section -->
    <form class="px-8 pb-6 space-y-3">
      <!-- Input Group: Name -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="fullName" name="fullName" placeholder="Tu nombre" required="" type="text" />
      </div>
      <!-- Input Group: Email -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="email" name="email" placeholder="correo@ejemplo.com" type="email" />
      </div>
      <!-- Input Group: Phone -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="phone" name="phone" placeholder="Número de teléfono" type="tel" />
      </div>
      <!-- Input Group: Message -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <textarea
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="2"></textarea>
      </div>
      <!-- Input Group: Photos -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="photos">Adjuntar fotografías — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <div class="relative">
          <input accept="image/*" class="hidden" id="photos" multiple="" name="photos" type="file" />
          <label for="photos"
            class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg border-2 border-dashed border-gray-500 hover:border-red-400 bg-gray-800/50 hover:bg-gray-800 text-gray-200 text-xs font-medium cursor-pointer transition-colors duration-200 active:scale-[0.99] touch-manipulation">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Seleccionar fotos</span>
          </label>
        </div>
        <div id="photos-preview" class="flex flex-wrap gap-1.5 pt-1 max-h-24 overflow-y-auto"></div>
      </div>
      <!-- Submit Button -->
      <div class="pt-2">
        <button
          class="w-full py-3 px-4 bg-[#f05252] hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]"
          type="submit">Enviar Mensaje</button>
      </div>
    </form>
  </main>

  <!-- Modal Timbre -->
  <div id="timbre-modal" class="timbre-modal" aria-hidden="true" role="dialog">
    <div class="timbre-modal-card">
      <div class="timbre-bell-icon">🔔</div>
      <p class="timbre-modal-text">Timbre sonando</p>
    </div>
  </div>

  <!-- Modal Timbre Limitado / Bloqueado -->
  <div id="timbre-limit-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="assertive">
    <div class="timbre-modal-card timbre-limit-card">
      <div class="timbre-limit-header">
        <div class="timbre-limit-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <h3 class="timbre-limit-title">Timbre limitado</h3>
      </div>
      <p class="timbre-limit-text" id="timbre-limit-text">Espera 30 minutos para volver a usarlo.</p>
    </div>
  </div>

  <!-- Modal Mensaje Enviado -->
  <div id="msg-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="polite">
    <div class="timbre-modal-card msg-modal-card">
      <div class="msg-modal-content">
        <svg class="msg-plane-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M1.101 12.102c-.727-.272-.718-.707.034-.988L22.25 3.328c.84-.336 1.455.158 1.18 1.135L19.9 20.354c-.287 1.07-1.01 1.291-1.874.779l-5.46-4.025-2.634 2.535c-.29.29-.536.536-1.1.536l.39-5.558 10.12-9.141c.44-.39-.096-.607-.682-.217L6.19 13.064l-5.089-.962z" />
        </svg>
        <span class="msg-modal-text">Mensaje enviado</span>
      </div>
    </div>
  </div>

  <!-- Modal Ampliar Imagen -->
  <div id="image-modal" class="image-modal" aria-hidden="true" role="dialog" aria-label="Imagen ampliada de Puerta 2">
    <div class="image-modal-card" id="image-modal-card">
      <button class="image-modal-close" id="btn-close-image" aria-label="Cerrar imagen">&times;</button>
      <img alt="Puerta 2 ampliada" src="imagenes/puerta2.jpeg" />
    </div>
  </div>

  <script src="timbre.js"></script>
  <script>
    (function () {
      var modal = document.getElementById('timbre-modal');
      var modalText = modal ? modal.querySelector('.timbre-modal-text') : null;
      var btnTimbre = document.getElementById('btn-timbre-p2');
      var timerId = null;

      function playChime() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();

          var osc1 = ctx.createOscillator();
          var gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
          gain1.gain.setValueAtTime(0.3, ctx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(ctx.currentTime);
          osc1.stop(ctx.currentTime + 0.9);

          var osc2 = ctx.createOscillator();
          var gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.35);
          gain2.gain.setValueAtTime(0.35, ctx.currentTime + 0.35);
          gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(ctx.currentTime + 0.35);
          osc2.stop(ctx.currentTime + 1.4);
        } catch (e) { }
      }

      function refreshButton() {
        if (btnTimbre) {
          window.TimbreManager.updateButtonState(btnTimbre, '2');
        }
      }

      if (btnTimbre) {
        refreshButton();
        setInterval(refreshButton, 1000);

        btnTimbre.addEventListener('click', function () {
          window.TimbreManager.triggerDoorbell('2', function (result) {
            if (!result.allowed) {
              refreshButton();
              return;
            }

            if (modalText) {
              if (result.isThird) {
                modalText.textContent = "Timbre sonando. Has alcanzado el límite de 3 toques. Podrás volver a tocar el timbre en 30 minutos.";
              } else {
                modalText.textContent = "Timbre sonando";
              }
            }

            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            playChime();

            if (timerId) clearTimeout(timerId);
            timerId = setTimeout(function () {
              modal.classList.remove('active');
              modal.setAttribute('aria-hidden', 'true');
            }, result.isThird ? 4000 : 2500);

            refreshButton();
          });
        });
      }

      // Manejo de envío de formulario al backend Cloudflare Worker
      var contactForm = document.querySelector('form');
      var msgModal = document.getElementById('msg-modal');
      var msgTimerId = null;

      function showMessageSentNotification() {
        if (!msgModal) return;
        msgModal.classList.add('active');
        msgModal.setAttribute('aria-hidden', 'false');
        if (msgTimerId) clearTimeout(msgTimerId);
        msgTimerId = setTimeout(function () {
          msgModal.classList.remove('active');
          msgModal.setAttribute('aria-hidden', 'true');
        }, 5000);
      }

      if (contactForm) {
        contactForm.addEventListener('submit', async function (e) {
          e.preventDefault();

          var submitBtn = contactForm.querySelector('button[type="submit"]');
          var originalBtnText = submitBtn ? submitBtn.textContent : 'Enviar Mensaje';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
          }

          var formData = new FormData();
          var fullNameVal = document.getElementById('fullName') ? document.getElementById('fullName').value.trim() : '';
          var emailVal = document.getElementById('email') ? document.getElementById('email').value.trim() : '';
          var phoneVal = document.getElementById('phone') ? document.getElementById('phone').value.trim() : '';
          var messageVal = document.getElementById('message') ? document.getElementById('message').value.trim() : '';
          var photosInput = document.getElementById('photos');

          formData.append('nombre', fullNameVal);
          formData.append('email', emailVal);
          formData.append('telefono', phoneVal);
          formData.append('mensaje', messageVal);
          formData.append('puerta', 'Puerta 2');

          if (photosInput && photosInput.files && photosInput.files.length > 0) {
            formData.append('foto', photosInput.files[0]);
          }

          try {
            var response = await window.TimbreManager.sendForm(formData, '2');
            if (response.ok) {
              showMessageSentNotification();
              contactForm.reset();
              var photosPreview = document.getElementById('photos-preview');
              if (photosPreview) photosPreview.innerHTML = '';
            } else {
              console.error('Hubo un problema al enviar el mensaje');
            }
          } catch (err) {
            console.error('Error al enviar el formulario:', err);
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = originalBtnText;
            }
          }
        });
      }

      // Ampliación de imagen
      var imgModal = document.getElementById('image-modal');
      var doorAvatar = document.getElementById('door-avatar');
      var btnCloseImg = document.getElementById('btn-close-image');
      var imageTimerId = null;

      function openImageModal() {
        if (!imgModal) return;
        imgModal.classList.add('active');
        imgModal.setAttribute('aria-hidden', 'false');

        if (imageTimerId) clearTimeout(imageTimerId);
        imageTimerId = setTimeout(function () {
          closeImageModal();
        }, 3000);
      }

      function closeImageModal() {
        if (!imgModal) return;
        imgModal.classList.remove('active');
        imgModal.setAttribute('aria-hidden', 'true');
        if (imageTimerId) {
          clearTimeout(imageTimerId);
          imageTimerId = null;
        }
      }

      if (doorAvatar) {
        doorAvatar.addEventListener('click', openImageModal);
        doorAvatar.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openImageModal();
          }
        });
      }

      if (imgModal) {
        imgModal.addEventListener('click', closeImageModal);
      }

      if (btnCloseImg) {
        btnCloseImg.addEventListener('click', function (e) {
          e.stopPropagation();
          closeImageModal();
        });
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && imgModal && imgModal.classList.contains('active')) {
          closeImageModal();
        }
      });

      // Vista previa de fotografías seleccionadas
      var photosInput = document.getElementById('photos');
      var photosPreview = document.getElementById('photos-preview');

      if (photosInput && photosPreview) {
        photosInput.addEventListener('change', function () {
          photosPreview.innerHTML = '';
          var files = Array.from(this.files);

          files.forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            var reader = new FileReader();
            reader.onload = function (e) {
              var container = document.createElement('div');
              container.className = 'relative w-12 h-12 rounded-lg overflow-hidden border border-red-400/40 shrink-0 bg-gray-900';

              var img = document.createElement('img');
              img.src = e.target.result;
              img.className = 'w-full h-full object-cover';
              img.alt = file.name;

              container.appendChild(img);
              photosPreview.appendChild(container);
            };
            reader.readAsDataURL(file);
          });
        });
      }
    })();
  </script>
</body>

</html>
