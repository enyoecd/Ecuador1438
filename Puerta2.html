<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Puerta 2 - Ecuador 1438</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="CSS/puerta2.css" />
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">
  <!-- BEGIN: MainContactCard -->
  <main class="w-full max-w-sm max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-[2.5rem] relative shadow-2xl"
    style="background-color: var(--card-bg);">
    <!-- Header Section with Icon -->
    <div class="relative pt-20 pb-3 flex flex-col items-center">
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between">
        <button aria-label="Regresar a la página anterior"
          class="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl border border-red-300/40 bg-[#f05252] px-3.5 py-1.5 text-sm font-semibold text-white shadow-lg transition duration-200 ease-in-out hover:-translate-x-0.5 hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-[#f05252] focus:ring-offset-2 focus:ring-offset-[#2d3748] active:translate-x-0"
          onclick="window.history.back()" type="button">
          <svg class="w-4 h-4 text-[#4c0519] stroke-[2.75] shrink-0" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
          </svg>
          <span class="leading-none">Regresar</span>
        </button>
        <button id="btn-timbre-p2"
          class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-red-300/60 bg-[#f05252]/15 px-3.5 py-1.5 text-sm font-bold text-[#f05252] shadow-lg transition duration-200 ease-in-out hover:bg-[#f05252] hover:text-white focus:outline-none active:scale-95"
          type="button">
          <span>🔔</span>
          <span>Timbre</span>
        </button>
      </div>
      <div id="door-avatar" class="door-avatar-pulse w-20 h-20 shrink-0 mt-2" role="button"
        aria-label="Ampliar imagen Puerta 2" tabindex="0">
        <div
          class="overflow-hidden rounded-full shadow-lg flex items-center justify-center w-full h-full border-4 border-[#1a2a3a]">
          <img alt="Puerta 2" class="w-full h-full object-cover" src="imagenes/puerta2.jpeg" />
        </div>
      </div>
      <h2 class="text-lg font-bold mt-2 text-red-400"><a href="https://t.me/Puerta2Ecuador1438?utm_source=chatgpt.com" target="_blank" rel="noopener noreferrer" class="hidden-p-link">P</a>uerta 2 - Ecuador 1438</h2>
    </div>

    <!-- Form Section -->
    <form class="px-8 pb-6 space-y-3">
      <!-- Input Group: Name -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="fullName" name="fullName" placeholder="Tu nombre" required="" type="text" />
      </div>
      <!-- Input Group: Email -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="email" name="email" placeholder="correo@ejemplo.com" type="email" />
      </div>
      <!-- Input Group: Phone -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="phone" name="phone" placeholder="Número de teléfono" type="tel" />
      </div>
      <!-- Input Group: Message -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <textarea
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-red-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="2"></textarea>
      </div>
      <!-- Input Group: Photos -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="photos">Adjuntar fotografías — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <div class="relative">
          <input accept="image/*" class="hidden" id="photos" multiple="" name="photos" type="file" />
          <label for="photos"
            class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg border-2 border-dashed border-gray-500 hover:border-red-400 bg-gray-800/50 hover:bg-gray-800 text-gray-200 text-xs font-medium cursor-pointer transition-colors duration-200 active:scale-[0.99] touch-manipulation">
            <svg class="w-4 h-4 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Seleccionar fotos</span>
          </label>
        </div>
        <div id="photos-preview" class="flex flex-wrap gap-1.5 pt-1 max-h-24 overflow-y-auto"></div>
      </div>
      <!-- Submit Button -->
      <div class="pt-2">
        <button
          class="w-full py-3 px-4 bg-[#f05252] hover:bg-red-600 text-white font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]"
          type="submit">Enviar Mensaje</button>
      </div>
    </form>
  </main>

  <!-- Modal Timbre -->
  <div id="timbre-modal" class="timbre-modal" aria-hidden="true" role="dialog">
    <div class="timbre-modal-card">
      <div class="timbre-bell-icon">🔔</div>
      <p class="timbre-modal-text">Timbre sonando</p>
    </div>
  </div>

  <!-- Modal Timbre Limitado / Bloqueado -->
  <div id="timbre-limit-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="assertive">
    <div class="timbre-modal-card timbre-limit-card">
      <div class="timbre-limit-header">
        <div class="timbre-limit-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <h3 class="timbre-limit-title">Límite alcanzado</h3>
      </div>
      <p class="timbre-limit-text" id="timbre-limit-text">Vuelve a usarlo en 30 minutos.</p>
    </div>
  </div>

  <!-- Modal Mensaje Enviado -->
  <div id="msg-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="polite">
    <div class="timbre-modal-card msg-modal-card">
      <div class="msg-modal-content">
        <svg class="msg-plane-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M1.101 12.102c-.727-.272-.718-.707.034-.988L22.25 3.328c.84-.336 1.455.158 1.18 1.135L19.9 20.354c-.287 1.07-1.01 1.291-1.874.779l-5.46-4.025-2.634 2.535c-.29.29-.536.536-1.1.536l.39-5.558 10.12-9.141c.44-.39-.096-.607-.682-.217L6.19 13.064l-5.089-.962z" />
        </svg>
        <span class="msg-modal-text">Mensaje enviado</span>
      </div>
    </div>
  </div>

  <!-- Modal Ampliar Imagen -->
  <div id="image-modal" class="image-modal" aria-hidden="true" role="dialog" aria-label="Imagen ampliada de Puerta 2">
    <div class="image-modal-card" id="image-modal-card">
      <button class="image-modal-close" id="btn-close-image" aria-label="Cerrar imagen">&times;</button>
      <img alt="Puerta 2 ampliada" src="imagenes/puerta2.jpeg" />
    </div>
  </div>

  <script src="JS/timbre.js"></script>
  <script src="JS/puerta2.js"></script>
</body>

</html>
