<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Cámara Puerta 1 — Ecuador 1438</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style>
    body {
      background: #0a1019;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0f2fe;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      align-items: center;
      justify-content: center;
    }
    .video-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 2px solid rgba(56, 189, 248, 0.4);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
      background: #000;
      aspect-ratio: 4/3;
    }
    .video-container video, .video-container canvas {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      background: #000;
    }
    .live-badge {
      position: absolute; top: 12px; left: 14px;
      display: flex; align-items: center; gap: 5px;
      background: rgba(0,0,0,0.65); border: 1px solid rgba(239,68,68,0.5);
      border-radius: 6px; padding: 4px 10px;
      font-size: 0.7rem; font-weight: 700; color: #ef4444;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #ef4444; animation: blink 1.1s ease-in-out infinite;
    }
    .local-pip {
      position: absolute; bottom: 12px; right: 12px;
      width: 100px; height: 75px; border-radius: 8px; overflow: hidden;
      border: 1.5px solid rgba(56,189,248,0.6); background: #000;
    }
    .local-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }
    .estado-card {
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1.5px solid rgba(56,189,248,0.3); border-radius: 1.5rem;
      padding: 32px 36px; max-width: 300px; text-align: center;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);
    }
    .btn-reintentar, .btn-colgar, .btn-mute {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px; border-radius: 10px; font-size: 0.85rem;
      font-weight: 700; cursor: pointer; transition: background 200ms ease;
    }
    .btn-reintentar { margin-top: 16px; background: rgba(56,189,248,0.15); border: 1.5px solid rgba(56,189,248,0.4); color: #38bdf8; }
    .btn-colgar     { background: rgba(239,68,68,0.15); border: 1.5px solid rgba(239,68,68,0.5); color: #ef4444; }
    .btn-mute       { background: rgba(56,189,248,0.1); border: 1.5px solid rgba(56,189,248,0.3); color: #38bdf8; }
    .btn-reintentar:hover { background: rgba(56,189,248,0.28); }
    .btn-colgar:hover { background: rgba(239,68,68,0.28); }
    .btn-mute:hover { background: rgba(56,189,248,0.22); }
    .footer-controles { width: 100%; max-width: 480px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 4px; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(56,189,248,0.2); border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="p-4">

  <!-- Estado: cargando -->
  <div id="estado-cargando" style="text-align:center;">
    <div class="spinner"></div>
    <p style="color:#94a3b8; font-size:0.9rem;">Verificando transmisión...</p>
  </div>

  <!-- Estado: sin sesión activa -->
  <div id="estado-sin-sesion" class="estado-card" style="display:none;">
    <div style="font-size:3rem; line-height:1; margin-bottom:12px;">📹</div>
    <h2 style="margin:0 0 8px; font-size:1.1rem; font-weight:700; color:#e0f2fe;">Sin transmisión activa</h2>
    <p style="margin:0; font-size:0.82rem; color:#94a3b8; line-height:1.4;">
      No hay ninguna cámara activa en la Puerta 1 en este momento.
    </p>
    <button class="btn-reintentar" id="btn-reintentar">🔄 Reintentar</button>
  </div>

  <!-- Estado: acceso denegado / token inválido -->
  <div id="estado-denegado" class="estado-card" style="display:none;">
    <div style="font-size:3rem; line-height:1; margin-bottom:12px;">🔒</div>
    <h2 style="margin:0 0 8px; font-size:1.1rem; font-weight:700; color:#e0f2fe;">Acceso denegado</h2>
    <p style="margin:0; font-size:0.82rem; color:#94a3b8; line-height:1.4;">
      Enlace inválido o token ausente. Si recibiste un enlace por Telegram, abre ese enlace (incluye el parámetro <code>?token=...</code>).
    </p>
  </div>

  <!-- Estado: conectado (viewer) -->
  <div id="estado-conectado" style="display:none; width:100%; max-width:480px; padding:0 4px;">
    <div class="video-container">
      <canvas id="remote-canvas" width="640" height="480" aria-label="Vista de cámara en vivo" style="display:none"></canvas>
      <video id="remote-video" autoplay playsinline></video>
      <div class="live-badge">
        <div class="live-dot"></div>
        <span>En vivo</span>
      </div>
      <div class="local-pip" id="local-pip" style="display:none;">
        <video id="local-video-pip" autoplay muted playsinline></video>
      </div>
    </div>

    <div class="footer-controles">
      <div>
        <p style="margin:0; font-size:0.78rem; font-weight:700; color:#e0f2fe;">Puerta 1 — Ecuador 1438</p>
        <p style="margin:0; font-size:0.72rem; color:#64748b; font-weight:600;" id="viewer-timer">00:00</p>
      </div>
      <div style="display:flex; gap:8px;">
        <button class="btn-mute" id="btn-mute-mic">🎤 Hablar</button>
        <button class="btn-colgar" id="btn-colgar">📵 Colgar</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // URL del Worker (backend puerta1). Prioridad:
      //   1) `?worker=...` en la URL (override explícito)
      //   2) window.ECUADOR1438_WORKER_URL (injectable desde la consola)
      //   3) `window.location.origin` si el frontend se sirve desde workers.dev
      //   4) URL pública del Worker desplegado
      var WORKER_URL = (function () {
        var q = new URLSearchParams(window.location.search || '').get('worker');
        if (q && q.indexOf('http') === 0) return q;
        if (window.ECUADOR1438_WORKER_URL) return window.ECUADOR1438_WORKER_URL;
        if ((window.location.protocol === 'http:' || window.location.protocol === 'https:') &&
            window.location.hostname.indexOf('workers.dev') !== -1) {
          return window.location.origin + '/';
        }
        return 'https://puerta1-ecuador1438.enyoecd.workers.dev/';
      })();

      // Leer token de la URL: el enlace seguro debe incluir ?token=T0K3N...
      var URL_PARAMS = new URLSearchParams(window.location.search || '');
      var VIEWER_TOKEN = URL_PARAMS.get('token') || null;

      var viewerState = {
        connected: false, sessionId: null, appId: null, pc: null,
        localStream: null, micEnabled: false, timerInterval: null, timerSeconds: 0,
        sfuMode: false, viewerSessionId: null, sourceSessionId: null, sourceTracks: [],
        channel: null, channelName: 'ecuador1438-camera-frames',
        framePoller: null, retryCount: 0
      };

      var elCargando    = document.getElementById('estado-cargando');
      var elSinSesion   = document.getElementById('estado-sin-sesion');
      var elConectado   = document.getElementById('estado-conectado');
      var elDenegado    = document.getElementById('estado-denegado');
      var remoteVideo   = document.getElementById('remote-video');
      var remoteCanvas  = document.getElementById('remote-canvas');
      var localPip      = document.getElementById('local-pip');
      var localVideoPip = document.getElementById('local-video-pip');
      var timerEl       = document.getElementById('viewer-timer');
      var btnReintentar = document.getElementById('btn-reintentar');
      var btnMute       = document.getElementById('btn-mute-mic');
      var btnColgar     = document.getElementById('btn-colgar');

      function mostrar(el) {
        [elCargando, elSinSesion, elConectado, elDenegado].forEach(function (e) { if (e) e.style.display = 'none'; });
        if (el) el.style.display = '';
      }

      function formatTime(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }

      // ── Proxy de signaling hacia el Worker ─────────────────────
      // Todo el SDP/ICE pasa por el Worker; el secret de Calls nunca
      // viaja al navegador.
      async function proxy(accion, payload) {
        var body = payload || {};
        body.tipo = 'camara';
        body.accion = accion;
        return await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
      }

      function renderFrameFromDataUrl(dataUrl) {
        if (!dataUrl || !remoteCanvas) return;
        var img = new Image();
        img.onload = function () {
          var ctx = remoteCanvas.getContext('2d');
          if (!ctx) return;
          remoteCanvas.width = img.width || 640;
          remoteCanvas.height = img.height || 480;
          ctx.clearRect(0, 0, remoteCanvas.width, remoteCanvas.height);
          ctx.drawImage(img, 0, 0, remoteCanvas.width, remoteCanvas.height);
        };
        img.src = dataUrl;
      }

      function aceptarFrameLocal(payload) {
        if (!payload || payload.type !== 'camera-frame' || !payload.dataUrl) return false;
        if (payload.sessionId && viewerState.sessionId && payload.sessionId !== viewerState.sessionId) return false;
        if (payload.ts && Date.now() - Number(payload.ts) > 10000) return false;
        renderFrameFromDataUrl(payload.dataUrl);
        return true;
      }

      function leerFrameLocal() {
        try {
          var raw = localStorage.getItem('ecuador1438-camera-frame');
          if (!raw) return;
          var payload = JSON.parse(raw);
          aceptarFrameLocal(payload);
        } catch (_) {}
      }

      function iniciarCanalLocal() {
        if (viewerState.channel || viewerState.framePoller) return;

        if ('BroadcastChannel' in window) {
          viewerState.channel = new BroadcastChannel(viewerState.channelName);
          viewerState.channel.onmessage = function (event) {
            aceptarFrameLocal(event.data || {});
          };
        }

        window.addEventListener('storage', function (event) {
          if (!event.key || event.key !== 'ecuador1438-camera-frame' || !event.newValue) return;
          try {
            var payload = JSON.parse(event.newValue);
            aceptarFrameLocal(payload);
          } catch (_) {}
        });

        viewerState.framePoller = setInterval(function () {
          leerFrameLocal();
        }, 500);
      }

      function iniciarModoLocalDataUrl(dataUrl, sessionId) {
        showRemoteCanvas();
        viewerState.sessionId = sessionId || null;
        mostrar(elConectado);
        viewerState.connected = true;
        viewerState.retryCount = 0;
        iniciarTimer();
        iniciarCanalLocal();
        if (dataUrl) renderFrameFromDataUrl(dataUrl);
      }

      function showRemoteVideo() {
        if (remoteVideo) remoteVideo.style.display = '';
        if (remoteCanvas) remoteCanvas.style.display = 'none';
      }

      function showRemoteCanvas() {
        if (remoteVideo) remoteVideo.style.display = 'none';
        if (remoteCanvas) remoteCanvas.style.display = '';
      }

      function iniciarTimer() {
        viewerState.timerSeconds = 0;
        if (timerEl) timerEl.textContent = '00:00';
        if (viewerState.timerInterval) clearInterval(viewerState.timerInterval);
        viewerState.timerInterval = setInterval(function () {
          viewerState.timerSeconds++;
          if (timerEl) timerEl.textContent = formatTime(viewerState.timerSeconds);
        }, 1000);
      }

      async function verificarYConectar() {
        mostrar(elCargando);
        var data = {};
        try {
          var estadoUrl = WORKER_URL + '?tipo=camara&accion=estado' + (VIEWER_TOKEN ? ('&token=' + encodeURIComponent(VIEWER_TOKEN)) : '');
          var r = await fetch(estadoUrl, { cache: 'no-store' });
          if (r.status === 401) { mostrar(elDenegado); return; }
          data = await r.json();
        } catch (_) {
          data = {};
        }

        if (!data.ocupado) {
          var localFrame = null;
          try {
            localFrame = JSON.parse(localStorage.getItem('ecuador1438-camera-frame') || 'null');
          } catch (_) {}
          if (localFrame && localFrame.type === 'camera-frame' && localFrame.dataUrl) {
            iniciarModoLocalDataUrl(localFrame.dataUrl, localFrame.sessionId || null);
            return;
          }
          mostrar(elSinSesion);
          return;
        }

        // Sesión activa: reservar una sesión de viewer a través del Worker.
        var initData = {};
        try {
          // Cerrar una sesión de viewer anterior (reintentos) para no fugarlas.
          if (viewerState.viewerSessionId) {
            proxy('finalizar-viewer', { sessionId: viewerState.viewerSessionId }).catch(function () {});
            viewerState.viewerSessionId = null;
          }
          var fd = new FormData();
          fd.append('tipo', 'camara');
          fd.append('accion', 'viewer');
          if (VIEWER_TOKEN) fd.append('token', VIEWER_TOKEN);
          var r2 = await fetch(WORKER_URL, { method: 'POST', body: fd });
          if (r2.status === 401) { mostrar(elDenegado); return; }
          initData = await r2.json();
        } catch (_) { mostrar(elSinSesion); return; }

        if (!initData.ok) { mostrar(elSinSesion); return; }

        if (initData.localMode || !initData.appId || !initData.viewerSessionId) {
          // Modo local: el Worker no tiene Calls configurado. Solo sirve
          // entre pestañas del mismo navegador (BroadcastChannel/localStorage).
          var localFrame2 = null;
          try {
            localFrame2 = JSON.parse(localStorage.getItem('ecuador1438-camera-frame') || 'null');
          } catch (_) {}
          iniciarModoLocalDataUrl(
            (localFrame2 && localFrame2.dataUrl) || null,
            initData.sessionId || (localFrame2 && localFrame2.sessionId) || null
          );
          if (!(localFrame2 && localFrame2.dataUrl)) {
            var ctx = remoteCanvas ? remoteCanvas.getContext('2d') : null;
            if (ctx) {
              ctx.fillStyle = '#0a1019';
              ctx.fillRect(0, 0, remoteCanvas.width, remoteCanvas.height);
              ctx.fillStyle = '#38bdf8';
              ctx.font = 'bold 26px Segoe UI';
              ctx.textAlign = 'center';
              ctx.fillText('Cámara en vivo', remoteCanvas.width / 2, remoteCanvas.height / 2);
            }
          }
          return;
        }

        // Modo SFU real (Cloudflare Calls). Se fuerza el flujo de frames
        // por red (sin depender de BroadcastChannel/localStorage).
        viewerState.sessionId = initData.sourceSessionId || initData.sessionId;
        viewerState.appId = initData.appId;
        viewerState.viewerSessionId = initData.viewerSessionId;
        viewerState.sourceSessionId = initData.sourceSessionId || initData.sessionId;
        viewerState.sourceTracks = (initData.sourceTracks || []).filter(function (t) {
          return t && t.trackName;
        });

        if (!viewerState.sourceTracks.length) {
          // La cámara aún no ha publicado sus tracks. Reintentar.
          if (viewerState.retryCount < 10) {
            viewerState.retryCount++;
            setTimeout(verificarYConectar, 3000);
          } else {
            viewerState.retryCount = 0;
            mostrar(elSinSesion);
          }
          return;
        }

        await conectarComoViewer();
      }

      async function conectarComoViewer() {
        var pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
          bundlePolicy: 'max-bundle'
        });
        viewerState.pc = pc;

        pc.ontrack = function (e) {
          if (remoteVideo && e.streams && e.streams[0]) {
            remoteVideo.srcObject = e.streams[0];
            showRemoteVideo();
          }
        };

        var tracksToPull = viewerState.sourceTracks.map(function (t) {
          return { location: 'remote', sessionId: viewerState.sourceSessionId, trackName: t.trackName };
        });

        try {
          var pullResp = await proxy('tracks-new', {
            sessionId: viewerState.viewerSessionId,
            tracks: tracksToPull
          });
          var pullData = await pullResp.json();

          if (!pullData.sessionDescription) {
            throw new Error('Sin respuesta SDP del backend');
          }

          await pc.setRemoteDescription(new RTCSessionDescription(pullData.sessionDescription));

          if (viewerState.localStream) {
            viewerState.localStream.getTracks().forEach(function (t) {
              pc.addTrack(t, viewerState.localStream);
            });
          }

          var answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          var renegResp = await proxy('renegotiate', {
            sessionId: viewerState.viewerSessionId,
            sessionDescription: answer
          });
          if (!renegResp.ok) {
            var renegData = await renegResp.json().catch(function () { return {}; });
            throw new Error(renegData.error || ('Error en renegociación (' + renegResp.status + ')'));
          }
        } catch (e) {
          console.error('Error conectando como viewer:', e);
          desconectar();
          return;
        }

        viewerState.connected = true;
        viewerState.sfuMode = true;
        viewerState.retryCount = 0;
        mostrar(elConectado);
        iniciarTimer();

        pc.onconnectionstatechange = function () {
          if (pc.connectionState === 'failed' || pc.connectionState === 'closed') desconectar();
        };
      }

      async function pushLocalTracks() {
        if (!viewerState.pc || !viewerState.viewerSessionId) return;
        try {
          var offer = await viewerState.pc.createOffer();
          await viewerState.pc.setLocalDescription(offer);
          var tracks = viewerState.pc.getTransceivers()
            .filter(function (tr) { return tr.sender && tr.sender.track; })
            .map(function (tr) {
              return { location: 'local', mid: tr.mid, trackName: tr.sender.track.id };
            });
          if (!tracks.length) return;
          var resp = await proxy('tracks-new', {
            sessionId: viewerState.viewerSessionId,
            sessionDescription: offer,
            tracks: tracks
          });
          var data = await resp.json();
          if (data.sessionDescription) {
            await viewerState.pc.setRemoteDescription(new RTCSessionDescription(data.sessionDescription));
          }
        } catch (err) {
          console.error('Error al publicar micrófono del viewer:', err);
        }
      }

      async function toggleMic() {
        if (!viewerState.micEnabled) {
          try {
            var stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
            viewerState.localStream = stream;
            if (localVideoPip) localVideoPip.srcObject = stream;
            if (localPip) localPip.style.display = '';
            if (viewerState.sfuMode && viewerState.pc) {
              stream.getTracks().forEach(function (t) { viewerState.pc.addTrack(t, stream); });
              await pushLocalTracks();
            }
            viewerState.micEnabled = true;
            if (btnMute) btnMute.textContent = '🔇 Silenciar';
          } catch (e) { alert('No se pudo acceder al micrófono: ' + e.message); }
        } else {
          if (viewerState.localStream) viewerState.localStream.getTracks().forEach(function (t) { t.stop(); });
          viewerState.localStream = null;
          if (localPip) localPip.style.display = 'none';
          viewerState.micEnabled = false;
          if (btnMute) btnMute.textContent = '🎤 Hablar';
        }
      }

      function desconectar() {
        if (viewerState.timerInterval) { clearInterval(viewerState.timerInterval); viewerState.timerInterval = null; }
        if (viewerState.framePoller) { clearInterval(viewerState.framePoller); viewerState.framePoller = null; }
        if (viewerState.localStream) { viewerState.localStream.getTracks().forEach(function (t) { t.stop(); }); viewerState.localStream = null; }
        if (viewerState.pc) { viewerState.pc.close(); viewerState.pc = null; }
        if (viewerState.channel) { viewerState.channel.close(); viewerState.channel = null; }

        if (viewerState.viewerSessionId) {
          proxy('finalizar-viewer', { sessionId: viewerState.viewerSessionId }).catch(function () {});
        }

        viewerState.connected = false;
        viewerState.sfuMode = false;
        viewerState.viewerSessionId = null;
        viewerState.sourceSessionId = null;
        viewerState.sourceTracks = [];
        viewerState.micEnabled = false;
        if (btnMute) btnMute.textContent = '🎤 Hablar';
        if (remoteVideo) remoteVideo.srcObject = null;
        mostrar(elSinSesion);
      }

      if (btnReintentar) btnReintentar.addEventListener('click', verificarYConectar);
      if (btnMute)       btnMute.addEventListener('click', toggleMic);
      if (btnColgar)     btnColgar.addEventListener('click', desconectar);

      window.addEventListener('beforeunload', function () {
        if (viewerState.viewerSessionId) {
          var payload = JSON.stringify({ sessionId: viewerState.viewerSessionId });
          navigator.sendBeacon(
            WORKER_URL + '?tipo=camara&accion=finalizar-viewer',
            new Blob([payload], { type: 'application/json' })
          );
        }
      });

      verificarYConectar();
    })();
  </script>
</body>

</html>
