<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Puerta 1 - Ecuador 1438</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="CSS/puerta1.css" />
  <link rel="stylesheet" href="CSS/sfu.css" />
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">
  <!-- BEGIN: MainContactCard -->
  <main class="w-full max-w-sm max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-[2.5rem] relative shadow-2xl"
    style="background-color: var(--card-bg);">
    <!-- Header Section with Icon -->
    <div class="relative pt-20 pb-3 flex flex-col items-center">
<div class="absolute top-4 left-4 right-4 flex items-center justify-between gap-2">
          <button aria-label="Regresar a la página anterior"
            class="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl border border-sky-300/40 bg-[#38bdf8] px-3.5 py-1.5 text-sm font-semibold text-[#1a2a3a] shadow-lg transition duration-200 ease-in-out hover:-translate-x-0.5 hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-[#38bdf8] focus:ring-offset-2 focus:ring-offset-[#2d3748] active:translate-x-0"
            onclick="window.history.back()" type="button">
            <svg class="w-4 h-4 text-[#0f172a] stroke-[2.75] shrink-0" fill="none" stroke="currentColor"
              viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
            </svg>
            <span class="leading-none">Regresar</span>
          </button>
          <div class="flex items-center gap-1.5">
            <button id="btn-live-p1" type="button"
              class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-emerald-300/60 bg-emerald-500/15 px-3.5 py-1.5 text-sm font-bold text-emerald-400 shadow-lg transition duration-200 ease-in-out hover:bg-emerald-500 hover:text-[#052e12] focus:outline-none active:scale-95"
              aria-label="Activar cámara de la puerta en vivo">
              <span aria-hidden="true">📹</span>
              <span>En vivo</span>
            </button>
            <button id="btn-timbre-p1"
              class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-sky-300/60 bg-[#38bdf8]/15 px-3.5 py-1.5 text-sm font-bold text-[#38bdf8] shadow-lg transition duration-200 ease-in-out hover:bg-[#38bdf8] hover:text-[#1a2a3a] focus:outline-none active:scale-95"
              type="button">
              <span>🔔</span>
              <span>Timbre</span>
            </button>
          </div>
        </div>
      <div id="door-avatar" class="door-avatar-pulse w-20 h-20 shrink-0 mt-2" role="button"
        aria-label="Ampliar imagen Puerta 1" tabindex="0">
        <div
          class="overflow-hidden rounded-full shadow-lg flex items-center justify-center w-full h-full border-4 border-[#1a2a3a]">
          <img alt="Puerta 1" class="w-full h-full object-cover" src="imagenes/puerta1.jpeg" />
        </div>
      </div>
      <h2 class="text-lg font-bold mt-2 text-sky-300">Puerta 1 - Ecuador 1438</h2>
    </div>

    <!-- Form Section -->
    <form class="px-8 pb-6 space-y-3">
      <!-- Input Group: Name -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="fullName" name="fullName" placeholder="Tu nombre" required="" type="text" />
      </div>
      <!-- Input Group: Email -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="email" name="email" placeholder="correo@ejemplo.com" type="email" />
      </div>
      <!-- Input Group: Phone -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="phone" name="phone" placeholder="Número de teléfono" type="tel" />
      </div>
      <!-- Input Group: Contact Reason -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="contactReason">Motivo de contacto — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <select
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm cursor-pointer"
          id="contactReason" name="contactReason" required="">
          <option value="" disabled selected hidden>Seleccione un motivo</option>
          <option value="🖥️ Servicio técnico (computadoras)">🖥️ Servicio técnico (computadoras)</option>
          <option value="📦 Entrega de paquete">📦 Entrega de paquete</option>
          <option value="👤 Busco a una persona">👤 Busco a una persona</option>
          <option value="📋 Otro motivo">📋 Otro motivo</option>
        </select>
      </div>
      <!-- Input Group: Message -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <textarea
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="2"></textarea>
      </div>
      <!-- Input Group: Photos -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="photos">Adjuntar fotografías — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <div class="relative">
          <input accept="image/*" class="hidden" id="photos" multiple="" name="photos" type="file" />
          <label for="photos"
            class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg border-2 border-dashed border-gray-500 hover:border-sky-400 bg-gray-800/50 hover:bg-gray-800 text-gray-200 text-xs font-medium cursor-pointer transition-colors duration-200 active:scale-[0.99] touch-manipulation">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Seleccionar fotos</span>
          </label>
        </div>
        <div id="photos-preview" class="flex flex-wrap gap-1.5 pt-1 max-h-24 overflow-y-auto"></div>
      </div>
      <!-- Submit Button -->
      <div class="pt-2">
        <button
          class="w-full py-3 px-4 bg-[#38bdf8] hover:bg-sky-400 text-[#1a2a3a] font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]"
          type="submit">Enviar Mensaje</button>
      </div>
    </form>
  </main>

  <!-- Modal Timbre -->
  <div id="timbre-modal" class="timbre-modal" aria-hidden="true" role="dialog">
    <div class="timbre-modal-card">
      <div class="timbre-bell-icon">🔔</div>
      <p class="timbre-modal-text">Timbre sonando</p>
    </div>
  </div>

  <!-- Modal Timbre Limitado / Bloqueado -->
  <div id="timbre-limit-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="assertive">
    <div class="timbre-modal-card timbre-limit-card">
      <div class="timbre-limit-header">
        <div class="timbre-limit-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
        </div>
        <h3 class="timbre-limit-title">Límite alcanzado</h3>
      </div>
      <p class="timbre-limit-text" id="timbre-limit-text">Vuelve a usarlo en 30 minutos.</p>
    </div>
  </div>

  <!-- Modal Mensaje Enviado -->
  <div id="msg-modal" class="timbre-modal" aria-hidden="true" role="dialog" aria-live="polite">
    <div class="timbre-modal-card msg-modal-card">
      <div class="msg-modal-content">
        <svg class="msg-plane-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg">
          <path
            d="M1.101 12.102c-.727-.272-.718-.707.034-.988L22.25 3.328c.84-.336 1.455.158 1.18 1.135L19.9 20.354c-.287 1.07-1.01 1.291-1.874.779l-5.46-4.025-2.634 2.535c-.29.29-.536.536-1.1.536l.39-5.558 10.12-9.141c.44-.39-.096-.607-.682-.217L6.19 13.064l-5.089-.962z" />
        </svg>
        <span class="msg-modal-text">Mensaje enviado</span>
      </div>
    </div>
  </div>

  <!-- Modal Ampliar Imagen -->
  <div id="image-modal" class="image-modal" aria-hidden="true" role="dialog" aria-label="Imagen ampliada de Puerta 1">
    <div class="image-modal-card" id="image-modal-card">
      <button class="image-modal-close" id="btn-close-image" aria-label="Cerrar imagen">&times;</button>
      <img alt="Puerta 1 ampliada" src="imagenes/puerta1.jpeg" />
    </div>
  </div>

  <!-- Modal Cámara en Vivo -->
  <div id="camera-modal" class="camera-modal" aria-hidden="true" role="dialog"
    aria-label="Cámara de la puerta en vivo">
    <div class="camera-modal-card">
      <button id="btn-close-camera" class="camera-modal-close" type="button" aria-label="Cerrar cámara">&times;</button>

      <div id="cam-stage" class="camera-modal-stage">
        <!-- Cuadro superior: cámara local de la puerta -->
        <div class="cam-pane cam-pane-local">
          <video id="cam-live-video" class="camera-live-video" autoplay muted playsinline></video>
          <div id="cam-live-placeholder" class="camera-live-placeholder">
            <div class="sfu-spinner"></div>
            <p id="cam-hint-text" class="camera-live-hint">Activando la cámara…</p>
          </div>
          <div id="cam-status-pill" class="camera-status-pill is-hidden">
            <span class="dot" aria-hidden="true"></span>
            EN VIVO
          </div>
          <span class="cam-pane-label cam-pane-label-local">Puerta</span>
        </div>

        <!-- Cuadro inferior: el teléfono del visor que contestó (remoto) -->
        <div id="cam-return-pane" class="cam-pane cam-pane-remote is-hidden">
          <video id="cam-return-video" class="camera-live-video" autoplay playsinline></video>
          <div id="cam-return-placeholder" class="cam-return-placeholder is-hidden">
            <div class="sfu-spinner"></div>
            <p class="camera-live-hint">Esperando al visitante…</p>
          </div>
          <div id="cam-call-pill" class="cam-call-pill is-hidden">
            <span class="dot" aria-hidden="true"></span>
            EN LLAMADA
          </div>
          <span class="cam-pane-label cam-pane-label-remote">Residente</span>
        </div>
      </div>

      <!-- Controles de audio de la llamada -->
      <div id="cam-controls" class="cam-controls-bar is-hidden">
        <button id="btn-cam-speaker" class="cam-ctl" type="button"
          aria-label="Activar o silenciar el audio del visitante">🔊</button>
        <button id="btn-cam-mic" class="cam-ctl" type="button" aria-pressed="false"
          aria-label="Silenciar el micrófono de la puerta">
          <svg class="sfu-mic-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path class="sfu-mic-body"
              d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z" />
            <path class="sfu-mic-stand" d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.2M8.8 21.2h6.4" />
            <g class="sfu-mic-slash">
              <line class="sfu-mic-slash-halo" x1="5" y1="19.5" x2="19" y2="4.5" />
              <line class="sfu-mic-slash-line" x1="5" y1="19.5" x2="19" y2="4.5" />
            </g>
          </svg>
        </button>
      </div>

      <div id="cam-error" class="sfu-error is-hidden"></div>

      <p id="cam-note" class="camera-modal-note">La transmisión se está enviando por Telegram.</p>
    </div>
  </div>

  <!-- Capa local de control de tiempo (JS/time-gate.js) -->
  <div id="tg-clock" class="tg-clock is-hidden" role="timer" aria-label="Tiempo restante de uso de la cámara">
    <span class="tg-clock-icon" aria-hidden="true">⏱</span>
    <span class="tg-clock-value">02:00</span>
  </div>

  <div id="tg-toast" class="tg-toast is-hidden" role="status" aria-live="polite"></div>

  <script src="JS/timbre.js"></script>
  <script src="JS/puerta1.js"></script>
  <script src="JS/sfu.js"></script>
  <script src="JS/time-gate.js"></script>
  <script src="JS/camera.js"></script>

  <script>
    /* ═══════════════════════════════════════════════
       Capa local de control de tiempo · PUERTA 1 (emisor)
       ───────────────────────────────────────────────
       Todo aquí es local: ni fetch, ni WebSocket, ni
       DataChannel, ni señalización WebRTC. La única
       función de la app a la que se llama es la local
       que ya apaga la cámara (window.Puerta1Camera).
       ═══════════════════════════════════════════════ */
    (function () {
      'use strict';

      var MINUTO_MS = 60 * 1000;

      var btn = document.getElementById('btn-live-p1');
      var clockEl = document.getElementById('tg-clock');
      var toastEl = document.getElementById('tg-toast');
      var camVideo = document.getElementById('cam-live-video');
      if (!btn || !window.TimeGate) return;

      var refresco = null;   // actualiza el número del aviso por minuto

      var clock = TimeGate.create(clockEl, {
        onEnd: function () {
          // Si la cámara ya no está emitiendo, el contador se llegó a
          // agotar con la cámara cerrada: no hay bloqueo que aplicar.
          if (!emitiendo()) { clock.hide(); return; }

          // 00:00 → arranca el bloqueo de 5 minutos…
          TimeGate.guardarBloqueo(Date.now() + TimeGate.BLOQUEO_MS);
          mostrarAviso(60000);
          pintarBoton();

          // …y se llama ÚNICAMENTE a la función local que apaga la cámara.
          if (window.Puerta1Camera) window.Puerta1Camera.close();
        }
      });

      // ¿Hay cámara realmente emitiendo? Se mira el <video>, no la modal:
      // si el permiso se denegó la modal sigue abierta pero no hay stream,
      // y no debe contar como tiempo de uso.
      function emitiendo() {
        return !!(camVideo && camVideo.srcObject);
      }

      /* ── Aviso de función restringida ── */

      function textoAviso(bloq) {
        return 'Esta función se habilitará en ' + TimeGate.formatearMinutos(bloq.min) + '.';
      }

      // Solo actualiza el número mientras el aviso siga en pantalla; nunca
      // lo vuelve a mostrar por su cuenta.
      function refrescarAviso() {
        if (refresco) { clearTimeout(refresco); refresco = null; }
        if (!toastEl || toastEl.classList.contains('is-hidden')) return;
        var bloq = TimeGate.bloqueoVigente();
        if (!bloq) { TimeGate.toast(toastEl, '', 0); return; }
        toastEl.textContent = textoAviso(bloq);
        var diff = bloq.hasta - Date.now();
        refresco = setTimeout(refrescarAviso, (diff % MINUTO_MS) || MINUTO_MS);
      }

      // Minutos enteros, sin segundos.
      function mostrarAviso(ms) {
        var bloq = TimeGate.bloqueoVigente();
        if (!bloq) { TimeGate.toast(toastEl, '', 0); return; }
        TimeGate.toast(toastEl, textoAviso(bloq), ms);
        refrescarAviso();
      }

      /* ── Botón "En vivo" ── */

      // El botón nunca se deshabilita: debe seguir recibiendo clics para
      // poder explicar por qué no se abre la cámara.
      function pintarBoton() {
        var bloq = TimeGate.bloqueoVigente();
        if (bloq) {
          btn.classList.add('opacity-50', 'cursor-not-allowed');
          btn.setAttribute('aria-label', 'Función restringida. ' + textoAviso(bloq));
        } else {
          btn.classList.remove('opacity-50', 'cursor-not-allowed');
          btn.setAttribute('aria-label', 'Activar cámara de la puerta en vivo');
        }
      }

      // Veto de arranque: camera.js consulta esta puerta antes de abrir
      // la cámara. Si hay bloqueo, avisa y se devuelve false.
      if (window.Puerta1Camera) {
        window.Puerta1Camera.puerta(function () {
          var bloq = TimeGate.bloqueoVigente();
          if (!bloq) return true;      // sin bloqueo: la cámara se abre
          mostrarAviso(5000);
          pintarBoton();
          return false;
        });

        // camera.js notifica, no se llama: aquí no hay ninguna conexión ni
        // señalización en juego. Si el usuario cierra la cámara antes de
        // tiempo, la cuenta se cancela y no se genera bloqueo.
        window.Puerta1Camera.alCerrar(function () {
          clock.hide();
          pintarBoton();
        });
      }

      // El contador se arma en el clic válido, después de que el veto
      // haya pasado. Se vuelve a comprobar el bloqueo porque, al estar
      // en el mismo botón, este listener se ejecuta siempre: si no se
      // re-comprobara, arrancaría una cuenta de 2 minutos sobre una
      // cámara que ni siquiera se ha abierto.
      btn.addEventListener('click', function () {
        if (TimeGate.bloqueoVigente()) return;
        clock.start(TimeGate.LIMITE_MS);
      });

      // Al cargar: si el bloqueo guardado sigue vivo, el botón aparece
      // restringido. El aviso se ve al pulsar, no de entrada.
      pintarBoton();
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) pintarBoton();
      });
      window.addEventListener('pageshow', pintarBoton);
    })();
  </script>
</body>

</html>
