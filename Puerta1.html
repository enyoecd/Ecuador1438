<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pantalla de Contacto</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-colors">
    /* Custom colors based on the reference image */
    :root {
      --bg-stadium: #1a202c; /* Fallback */
      --card-bg: #2d3748;
      --input-bg: #ffffff;
      --button-bg: #38bdf8; /* Cyan/Teal */
      --text-label: #a0aec0;
      --text-white: #ffffff;
    }
    
    body {
      background-color: #1a2a3a; /* Dark navy background matching the app theme */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">
<!-- BEGIN: MainContactCard -->
<main class="w-full max-w-sm max-h-[calc(100dvh-2rem)] rounded-[2.5rem] overflow-hidden relative shadow-2xl" style="background-color: var(--card-bg);">
<!-- Header Section with Icon -->
<div class="relative pt-24 pb-3 flex flex-col items-center">
<!-- Decorative semi-circle top background if needed, but in the center reference it's just the card bg -->
<!-- Navigation and Icon -->
<div class="absolute top-4 left-4 flex items-start gap-3">
<button aria-label="Regresar a la página anterior" class="inline-flex min-h-11 items-center gap-2 rounded-xl border border-sky-300/40 bg-[#38bdf8] px-4 py-2 text-sm font-semibold text-[#1a2a3a] shadow-lg transition duration-200 ease-in-out hover:-translate-x-0.5 hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-[#38bdf8] focus:ring-offset-2 focus:ring-offset-[#2d3748] active:translate-x-0" onclick="window.history.back()" type="button">
<span aria-hidden="true" class="text-xl leading-none">←</span>
<span>Regresar</span>
</button>
<div class="overflow-hidden rounded-full shadow-lg flex items-center justify-center w-20 h-20 border-4 border-[#1a2a3a] shrink-0">
<img alt="Puerta 1" class="w-full h-full object-cover" src="imagenes/puerta1.jpeg"/>
</div>
</div>
</div>
<!-- Form Section -->
<form class="px-8 pb-6 space-y-3">
<!-- Input Group: Name -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre <span class="text-red-500">*</span></label>
<input class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="fullName" name="fullName" placeholder="Annia Rivera" required="" type="text"/>
</div>
<!-- Input Group: Email -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo </label>
<input class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="email" name="email" placeholder="anniarivera@correo.com" type="email"/>
</div>
<!-- Input Group: Phone -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono </label>
<input class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="phone" name="phone" placeholder="5518466329" type="tel"/>
</div>
<!-- Input Group: Postal Code -->
<div class="space-y-1"><label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje <span class="text-red-500">*</span></label><textarea class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="3"></textarea></div>
<!-- Submit Button -->
<div class="pt-3">
<button class="w-full py-3 px-4 bg-[#38bdf8] hover:bg-sky-400 text-[#1a2a3a] font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]" type="submit">Enviar Mensaje</button>
</div>
</form>
</main>
<!-- END: MainContactCard -->
</body></html>
