<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Pantalla de Contacto</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-colors">
    /* Custom colors based on the reference image */
    :root {
      --bg-stadium: #1a202c; /* Fallback */
      --card-bg: #2d3748;
      --input-bg: #ffffff;
      --button-bg: #38bdf8; /* Cyan/Teal */
      --text-label: #a0aec0;
      --text-white: #ffffff;
    }
    
    body {
      background-color: #1a2a3a; /* Dark navy background matching the app theme */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4 text-white">
<!-- BEGIN: MainContactCard -->
<main class="w-full max-w-sm rounded-[2.5rem] overflow-hidden relative shadow-2xl" style="background-color: var(--card-bg);">
<!-- Header Section with Icon -->
<div class="relative pt-12 pb-6 flex flex-col items-center">
<!-- Decorative semi-circle top background if needed, but in the center reference it's just the card bg -->
<!-- Icon Container -->
<div class="absolute -top-10 bg-white rounded-full p-3 shadow-lg flex items-center justify-center w-20 h-20 border-4 border-[#1a2a3a]">
<!-- Soccer Ball Icon SVG (Placeholder) -->
<svg class="w-12 h-12 text-gray-800" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v4h-2zm0 6h2v2h-2z" opacity="0.3"></path>
<!-- A more soccer-ball-like simple SVG -->
<circle cx="12" cy="12" fill="none" r="10" stroke="currentColor" stroke-width="2"></circle>
<path d="M12 6l-3 4h6zM7 11l2 5h-4zM17 11h4l-2 5zM12 18l-3-4h6z" fill="currentColor"></path>
</svg>
</div>
<!-- Title -->
<h1 class="text-2xl font-bold mt-8 text-center px-4 tracking-wide">Contáctanos</h1>
</div>
<!-- Form Section -->
<form class="px-8 pb-10 space-y-5">
<!-- Input Group: Name -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre Completo <span class="text-red-500">*</span></label>
<input class="w-full px-4 py-2.5 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="fullName" name="fullName" placeholder="Annia Rivera" required="" type="text"/>
</div>
<!-- Input Group: Email -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo Electrónico</label>
<input class="w-full px-4 py-2.5 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="email" name="email" placeholder="anniarivera@correo.com" type="email"/>
</div>
<!-- Input Group: Phone -->
<div class="space-y-1">
<label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono Celular</label>
<input class="w-full px-4 py-2.5 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="phone" name="phone" placeholder="5518466329" type="tel"/>
</div>
<!-- Input Group: Postal Code -->
<div class="space-y-1"><label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje <span class="text-red-500">*</span></label><textarea class="w-full px-4 py-2.5 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400" id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="4"></textarea></div>
<!-- Submit Button -->
<div class="pt-6 pb-2">
<button class="w-full py-3.5 px-4 bg-[#38bdf8] hover:bg-sky-400 text-[#1a2a3a] font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]" type="submit">Enviar Mensaje</button>
</div>
</form>
</main>
<!-- END: MainContactCard -->
</body></html>
