<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Puerta 1 - Ecuador 1438</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style data-purpose="custom-colors">
    :root {
      --bg-stadium: #1a202c;
      --card-bg: #2d3748;
      --input-bg: #ffffff;
      --button-bg: #38bdf8;
      --text-label: #a0aec0;
      --text-white: #ffffff;
    }

    body {
      background-color: #1a2a3a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    .door-avatar-pulse {
      position: relative;
      isolation: isolate;
    }

    .door-avatar-pulse::after {
      content: "";
      position: absolute;
      inset: -4px;
      z-index: -1;
      border: 2px solid #38bdf8;
      border-radius: 9999px;
      background: rgb(56 189 248 / 12%);
      box-shadow: 0 0 0 1px rgb(255 255 255 / 30%), 0 0 14px #38bdf8;
      pointer-events: none;
      animation: door-avatar-pulse 2.4s ease-in-out infinite;
    }

    @keyframes door-avatar-pulse {

      0%,
      100% {
        opacity: .5;
        transform: scale(1);
      }

      50% {
        opacity: .95;
        transform: scale(1.09);
      }
    }

    /* Modal Timbre styling */
    .timbre-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.65);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
      padding: 16px;
    }

    .timbre-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .timbre-modal-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px 36px;
      border-radius: 1.5rem;
      background: #2d3748;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
      transform: scale(0.85);
      transition: transform 220ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 280px;
      width: 100%;
      border: 2px solid #38bdf8;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(56, 189, 248, 0.3);
    }

    .timbre-modal.active .timbre-modal-card {
      transform: scale(1);
    }

    .timbre-bell-icon {
      font-size: 3.2rem;
      line-height: 1;
      display: inline-block;
      transform-origin: top center;
    }

    .timbre-modal.active .timbre-bell-icon {
      animation: bell-ring 0.55s ease-in-out infinite alternate;
    }

    .timbre-modal-text {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 700;
      color: #e0f2fe;
      letter-spacing: 0.02em;
      text-align: center;
    }

    @keyframes bell-ring {
      0% {
        transform: rotate(-24deg);
      }

      100% {
        transform: rotate(24deg);
      }
    }

    /* Modal Mensaje Enviado */
    .msg-modal-card {
      max-width: 300px;
      padding: 24px 32px;
    }

    .msg-modal-content {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .msg-plane-icon {
      width: 2.2rem;
      height: 2.2rem;
      color: #38bdf8;
      display: inline-block;
      flex-shrink: 0;
    }

    .timbre-modal.active .msg-plane-icon {
      animation: paper-plane-fly 1.4s ease-in-out infinite alternate;
    }

    .msg-modal-text {
      font-size: 1.15rem;
      font-weight: 700;
      color: #e0f2fe;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    @keyframes paper-plane-fly {
      0% {
        transform: translate(-8px, 6px) scale(0.85);
        opacity: 0.7;
      }

      50% {
        transform: translate(4px, -4px) scale(1.08);
        opacity: 1;
      }

      100% {
        transform: translate(10px, -10px) scale(1.02);
        opacity: 0.95;
      }
    }

    /* Modal Aviso Límite Timbre */
    .timbre-limit-card {
      max-width: 250px;
      width: 85%;
      padding: 14px 18px;
      border-radius: 1.25rem;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1.5px solid #f59e0b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.2);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
      cursor: pointer;
    }

    .timbre-limit-header {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .timbre-limit-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 9999px;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      flex-shrink: 0;
    }

    .timbre-limit-icon svg {
      width: 15px;
      height: 15px;
      stroke: #fbbf24;
    }

    .timbre-limit-title {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.01em;
      line-height: 1.2;
    }

    .timbre-limit-text {
      margin: 0;
      font-size: 0.82rem;
      font-weight: 500;
      color: #e2e8f0;
      line-height: 1.35;
    }

    #btn-timbre-p1.timbre-locked, #btn-timbre-p1.timbre-disabled {
      opacity: 0.55;
      filter: grayscale(0.5);
      cursor: pointer;
    }

    #btn-timbre-p1.timbre-locked:hover, #btn-timbre-p1.timbre-disabled:hover {
      opacity: 0.75;
      filter: grayscale(0.2);
    }

    select:invalid {
      color: #9ca3af;
    }

    select option {
      color: #111827;
    }

    select option[disabled] {
      color: #9ca3af;
    }

    /* Modal Ampliar Imagen styling */
    .image-modal {
      position: fixed;
      inset: 0;
      z-index: 9998;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 280ms ease, visibility 280ms ease;
      padding: 16px;
      cursor: pointer;
    }

    .image-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .image-modal-card {
      position: relative;
      max-width: min(88vw, 420px);
      max-height: 75vh;
      border-radius: 1.25rem;
      overflow: hidden;
      border: 2px solid #38bdf8;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 25px rgba(56, 189, 248, 0.35);
      transform: scale(0.7);
      transition: transform 280ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
      background: #1a2a3a;
    }

    .image-modal.active .image-modal-card {
      transform: scale(1);
    }

    .image-modal-card img {
      display: block;
      width: 100%;
      height: auto;
      max-height: 75vh;
      object-fit: contain;
    }

    .image-modal-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 9999px;
      background: rgba(26, 42, 58, 0.85);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      z-index: 10;
      transition: background 180ms ease;
    }

    .image-modal-close:hover {
      background: #38bdf8;
      color: #1a2a3a;
    }

    .door-avatar-pulse {
      cursor: pointer;
      transition: transform 180ms ease;
    }

    .door-avatar-pulse:hover {
      transform: scale(1.05);
    }

    @media (prefers-reduced-motion: reduce) {
      .door-avatar-pulse::after {
        animation: none;
      }

      .image-modal-card {
        transition: none;
      }
    }

    /* ═══ CÁMARA — botón de video / transmisión en vivo ═══════ */
    #btn-camara-p1 .camara-dot {
      transition: background 200ms ease;
    }

    #btn-camara-p1.camara-activa {
      border-color: rgba(239, 68, 68, 0.6);
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
    }

    #btn-camara-p1.camara-activa .camara-dot {
      animation: camara-blink 1.1s ease-in-out infinite;
    }

    #btn-camara-p1.camara-ocupada {
      border-color: rgba(107, 114, 128, 0.4);
      background: rgba(107, 114, 128, 0.1);
      color: #9ca3af;
    }

    .camara-modal {
      position: fixed;
      inset: 0;
      z-index: 9997;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
      padding: 16px;
    }

    .camara-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .camara-modal-card {
      width: 100%;
      max-width: 430px;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 2px solid #38bdf8;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 25px rgba(56, 189, 248, 0.3);
      transform: scale(0.85);
      transition: transform 220ms cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .camara-modal.active .camara-modal-card {
      transform: scale(1);
    }

    .camara-video-wrap {
      position: relative;
      aspect-ratio: 4 / 3;
      background: #000;
    }

    .camara-video-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .camara-live-badge {
      position: absolute;
      top: 12px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 0.7rem;
      font-weight: 700;
      color: #ef4444;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .camara-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ef4444;
      animation: camara-blink 1.1s ease-in-out infinite;
    }

    @keyframes camara-blink {
      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.2;
      }
    }

    .camara-timer {
      position: absolute;
      bottom: 12px;
      right: 14px;
      background: rgba(0, 0, 0, 0.65);
      color: #e0f2fe;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 6px;
      letter-spacing: 0.05em;
    }

    .camara-modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 16px;
    }

    .camara-status-text {
      margin: 0;
      font-size: 0.8rem;
      font-weight: 600;
      color: #e0f2fe;
    }

    .btn-detener {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      background: rgba(239, 68, 68, 0.15);
      border: 1.5px solid rgba(239, 68, 68, 0.5);
      color: #ef4444;
      transition: background 200ms ease, color 200ms ease;
    }

    .btn-detener:hover {
      background: rgba(239, 68, 68, 0.3);
    }

    /* Modal Cámara Ocupada */
    .camara-busy-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(10, 16, 26, 0.6);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 220ms ease, visibility 220ms ease;
      padding: 16px;
    }

    .camara-busy-modal.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .camara-busy-card {
      max-width: 280px;
      width: 100%;
      text-align: center;
      padding: 24px 28px;
      border-radius: 1.25rem;
      background: linear-gradient(145deg, #1e293b, #0f172a);
      border: 1.5px solid #f59e0b;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55), 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .camara-busy-icon {
      font-size: 2.6rem;
      line-height: 1;
    }

    .camara-busy-title {
      margin: 8px 0 4px;
      font-size: 1rem;
      font-weight: 700;
      color: #fbbf24;
    }

    .camara-busy-text {
      margin: 0;
      font-size: 0.82rem;
      color: #e2e8f0;
      line-height: 1.4;
    }
  </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4 text-white">
  <!-- BEGIN: MainContactCard -->
  <main class="w-full max-w-sm max-h-[calc(100dvh-2rem)] overflow-y-auto rounded-[2.5rem] relative shadow-2xl"
    style="background-color: var(--card-bg);">
    <!-- Header Section with Icon -->
    <div class="relative pt-20 pb-3 flex flex-col items-center">
      <div class="absolute top-4 left-4 right-4 flex items-center justify-between gap-2">
        <button aria-label="Regresar a la página anterior"
          class="inline-flex min-h-10 items-center justify-center gap-1.5 rounded-xl border border-sky-300/40 bg-[#38bdf8] px-3.5 py-1.5 text-sm font-semibold text-[#1a2a3a] shadow-lg transition duration-200 ease-in-out hover:-translate-x-0.5 hover:bg-sky-400 focus:outline-none focus:ring-2 focus:ring-[#38bdf8] focus:ring-offset-2 focus:ring-offset-[#2d3748] active:translate-x-0"
          onclick="window.history.back()" type="button">
          <svg class="w-4 h-4 text-[#0f172a] stroke-[2.75] shrink-0" fill="none" stroke="currentColor"
            viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"></path>
          </svg>
          <span class="leading-none">Regresar</span>
        </button>
        <!-- Botón Video (Cámara) — transmite en vivo vía Cloudflare Calls SFU -->
        <button id="btn-camara-p1"
          aria-label="Iniciar transmisión de video"
          class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-sky-300/30 bg-[#38bdf8]/10 px-3 py-1.5 text-sm font-bold text-sky-300 shadow-lg transition duration-200 ease-in-out hover:bg-sky-500/20 hover:text-sky-200 focus:outline-none active:scale-95"
          type="button">
          <span class="camara-dot w-2 h-2 rounded-full bg-emerald-400 shrink-0"></span>
          <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"
            xmlns="http://www.w3.org/2000/svg" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path>
          </svg>
          <span id="camara-btn-label">Cámara</span>
        </button>
        <button id="btn-timbre-p1"
          class="inline-flex min-h-10 items-center gap-1.5 rounded-xl border border-sky-300/60 bg-[#38bdf8]/15 px-3.5 py-1.5 text-sm font-bold text-[#38bdf8] shadow-lg transition duration-200 ease-in-out hover:bg-[#38bdf8] hover:text-[#1a2a3a] focus:outline-none active:scale-95"
          type="button">
          <span>🔔</span>
          <span>Timbre</span>
        </button>
      </div>
      <div id="door-avatar" class="door-avatar-pulse w-20 h-20 shrink-0 mt-2" role="button"
        aria-label="Ampliar imagen Puerta 1" tabindex="0">
        <div
          class="overflow-hidden rounded-full shadow-lg flex items-center justify-center w-full h-full border-4 border-[#1a2a3a]">
          <img alt="Puerta 1" class="w-full h-full object-cover" src="imagenes/puerta1.jpeg" />
        </div>
      </div>
      <h2 class="text-lg font-bold mt-2 text-sky-300">Puerta 1 - Ecuador 1438</h2>
    </div>

    <!-- Form Section -->
    <form class="px-8 pb-6 space-y-3">
      <!-- Input Group: Name -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="fullName">Nombre — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="fullName" name="fullName" placeholder="Tu nombre" required="" type="text" />
      </div>
      <!-- Input Group: Email -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="email">Correo — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="email" name="email" placeholder="correo@ejemplo.com" type="email" />
      </div>
      <!-- Input Group: Phone -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="phone">Teléfono — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <input
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="phone" name="phone" placeholder="Número de teléfono" type="tel" />
      </div>
      <!-- Input Group: Contact Reason -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="contactReason">Motivo de contacto — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <select
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm cursor-pointer"
          id="contactReason" name="contactReason" required="">
          <option value="" disabled selected hidden>Seleccione un motivo</option>
          <option value="🖥️ Servicio técnico (computadoras)">🖥️ Servicio técnico (computadoras)</option>
          <option value="📦 Entrega de paquete">📦 Entrega de paquete</option>
          <option value="👤 Busco a una persona">👤 Busco a una persona</option>
          <option value="📋 Otro motivo">📋 Otro motivo</option>
        </select>
      </div>
      <!-- Input Group: Message -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="message">Mensaje — <span
            class="text-gray-300 font-semibold">Obligatorio</span> <span class="text-red-500">*</span></label>
        <textarea
          class="w-full px-4 py-2 rounded-lg border-0 focus:ring-2 focus:ring-sky-400 text-gray-900 bg-white shadow-inner text-sm placeholder-gray-400"
          id="message" name="message" placeholder="¿En qué podemos ayudarte?" required="" rows="2"></textarea>
      </div>
      <!-- Input Group: Photos -->
      <div class="space-y-1">
        <label class="block text-xs font-medium text-gray-300 ml-1" for="photos">Adjuntar fotografías — <span
            class="text-xs text-gray-400 font-normal">Opcional</span></label>
        <div class="relative">
          <input accept="image/*" class="hidden" id="photos" multiple="" name="photos" type="file" />
          <label for="photos"
            class="flex items-center justify-center gap-2 w-full px-4 py-2.5 rounded-lg border-2 border-dashed border-gray-500 hover:border-sky-400 bg-gray-800/50 hover:bg-gray-800 text-gray-200 text-xs font-medium cursor-pointer transition-colors duration-200 active:scale-[0.99] touch-manipulation">
            <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z">
              </path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            <span>Seleccionar fotos</span>
          </label>
        </div>
        <div id="photos-preview" class="flex flex-wrap gap-1.5 pt-1 max-h-24 overflow-y-auto"></div>
      </div>
      <!-- Submit Button -->
      <div class="pt-2">
        <button
          class="w-full py-3 px-4 bg-[#38bdf8] hover:bg-sky-400 text-[#1a2a3a] font-bold rounded-2xl shadow-lg transition duration-200 ease-in-out transform hover:scale-[1.02]"
          type="submit">Enviar Mensaje</button>
      </div>
    </form>
  </main>

  <!-- Modal Timbre -->
  <div id="timbre-modal" class="timbre-modal" aria-hidden="true" role="dialog">

  <script src="timbre.js"></script>
  <script>
    (function () {
      function formatDate(d) {
        var date = d || new Date();
        var dd = String(date.getDate()).padStart(2, '0');
        var mm = String(date.getMonth() + 1).padStart(2, '0');
        var yyyy = date.getFullYear();
        return dd + '/' + mm + '/' + yyyy;
      }

      function formatTime(d) {
        var date = d || new Date();
        var hh = String(date.getHours()).padStart(2, '0');
        var mm = String(date.getMinutes()).padStart(2, '0');
        var ss = String(date.getSeconds()).padStart(2, '0');
        return hh + ':' + mm + ':' + ss;
      }

      var modal = document.getElementById('timbre-modal');
      var modalText = modal ? modal.querySelector('.timbre-modal-text') : null;
      var btnTimbre = document.getElementById('btn-timbre-p1');
      var timerId = null;

      function playChime() {
        try {
          var AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          var ctx = new AudioCtx();
          if (ctx.state === 'suspended') ctx.resume();

          var osc1 = ctx.createOscillator();
          var gain1 = ctx.createGain();
          osc1.type = 'sine';
          osc1.frequency.setValueAtTime(659.25, ctx.currentTime);
          gain1.gain.setValueAtTime(0.3, ctx.currentTime);
          gain1.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.9);
          osc1.connect(gain1);
          gain1.connect(ctx.destination);
          osc1.start(ctx.currentTime);
          osc1.stop(ctx.currentTime + 0.9);

          var osc2 = ctx.createOscillator();
          var gain2 = ctx.createGain();
          osc2.type = 'sine';
          osc2.frequency.setValueAtTime(523.25, ctx.currentTime + 0.35);
          gain2.gain.setValueAtTime(0.35, ctx.currentTime + 0.35);
          gain2.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.4);
          osc2.connect(gain2);
          gain2.connect(ctx.destination);
          osc2.start(ctx.currentTime + 0.35);
          osc2.stop(ctx.currentTime + 1.4);
        } catch (e) { }
      }

      function refreshButton() {
        if (btnTimbre) {
          window.TimbreManager.updateButtonState(btnTimbre, '1');
        }
      }

      if (btnTimbre) {
        refreshButton();
        setInterval(refreshButton, 1000);

        btnTimbre.addEventListener('click', function () {
          window.TimbreManager.triggerDoorbell('1', function (result) {
            if (!result.allowed) {
              refreshButton();
              return;
            }

            if (modalText) {
              if (result.isThird) {
                modalText.textContent = "Timbre sonando. Vuelve a usarlo en 30 minutos.";
              } else {
                modalText.textContent = "Timbre sonando";
              }
            }

            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            playChime();

            if (timerId) clearTimeout(timerId);
            timerId = setTimeout(function () {
              modal.classList.remove('active');
              modal.setAttribute('aria-hidden', 'true');
            }, result.isThird ? 4000 : 2500);

            refreshButton();
          });
        });
      }

      // Manejo de envío de formulario al backend Cloudflare Worker
      var contactForm = document.querySelector('form');
      var msgModal = document.getElementById('msg-modal');
      var msgTimerId = null;

      function showMessageSentNotification() {
        if (!msgModal) return;
        msgModal.classList.add('active');
        msgModal.setAttribute('aria-hidden', 'false');
        if (msgTimerId) clearTimeout(msgTimerId);
        msgTimerId = setTimeout(function () {
          msgModal.classList.remove('active');
          msgModal.setAttribute('aria-hidden', 'true');
        }, 5000);
      }

      if (contactForm) {
        contactForm.addEventListener('submit', async function (e) {
          e.preventDefault();

          var nowEnvio = new Date();
          var fechaEnvio = formatDate(nowEnvio);
          var horaEnvio = formatTime(nowEnvio);

          var fechaIngreso = sessionStorage.getItem('fechaIngreso') || fechaEnvio;
          var horaIngreso = sessionStorage.getItem('horaIngreso') || horaEnvio;

          var submitBtn = contactForm.querySelector('button[type="submit"]');
          var originalBtnText = submitBtn ? submitBtn.textContent : 'Enviar Mensaje';
          if (submitBtn) {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Enviando...';
          }

          var formData = new FormData();
          var fullNameVal = document.getElementById('fullName') ? document.getElementById('fullName').value.trim() : '';
          var emailVal = document.getElementById('email') ? document.getElementById('email').value.trim() : '';
          var phoneVal = document.getElementById('phone') ? document.getElementById('phone').value.trim() : '';
          var contactReasonVal = document.getElementById('contactReason') ? document.getElementById('contactReason').value.trim() : '';
          var messageVal = document.getElementById('message') ? document.getElementById('message').value.trim() : '';
          var photosInput = document.getElementById('photos');

          var finalMessage = messageVal +
            '\n\nMotivo de contacto: ' + contactReasonVal +
            '\n\nFecha ingreso: ' + fechaIngreso +
            '\nHora ingreso: ' + horaIngreso +
            '\n\nFecha envío: ' + fechaEnvio +
            '\nHora envío: ' + horaEnvio;

          formData.append('nombre', fullNameVal);
          formData.append('email', emailVal);
          formData.append('telefono', phoneVal);
          formData.append('motivo', contactReasonVal);
          formData.append('mensaje', finalMessage);
          formData.append('puerta', 'Puerta 1');

          if (photosInput && photosInput.files && photosInput.files.length > 0) {
            formData.append('foto', photosInput.files[0]);
          }

          try {
            var response = await window.TimbreManager.sendForm(formData, '1');
            if (response.ok) {
              showMessageSentNotification();
              contactForm.reset();
              var photosPreview = document.getElementById('photos-preview');
              if (photosPreview) photosPreview.innerHTML = '';
            } else {
              console.error('Hubo un problema al enviar el mensaje');
            }
          } catch (err) {
            console.error('Error al enviar el formulario:', err);
          } finally {
            if (submitBtn) {
              submitBtn.disabled = false;
              submitBtn.textContent = originalBtnText;
            }
          }
        });
      }

      // Ampliación de imagen
      var imgModal = document.getElementById('image-modal');
      var doorAvatar = document.getElementById('door-avatar');
      var btnCloseImg = document.getElementById('btn-close-image');
      var imageTimerId = null;

      function openImageModal() {
        if (!imgModal) return;
        imgModal.classList.add('active');
        imgModal.setAttribute('aria-hidden', 'false');

        if (imageTimerId) clearTimeout(imageTimerId);
        imageTimerId = setTimeout(function () {
          closeImageModal();
        }, 3000);
      }

      function closeImageModal() {
        if (!imgModal) return;
        imgModal.classList.remove('active');
        imgModal.setAttribute('aria-hidden', 'true');
        if (imageTimerId) {
          clearTimeout(imageTimerId);
          imageTimerId = null;
        }
      }

      if (doorAvatar) {
        doorAvatar.addEventListener('click', openImageModal);
        doorAvatar.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            openImageModal();
          }
        });
      }

      if (imgModal) {
        imgModal.addEventListener('click', closeImageModal);
      }

      if (btnCloseImg) {
        btnCloseImg.addEventListener('click', function (e) {
          e.stopPropagation();
          closeImageModal();
        });
      }

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && imgModal && imgModal.classList.contains('active')) {
          closeImageModal();
        }
      });

      // Vista previa de fotografías seleccionadas
      var photosInput = document.getElementById('photos');
      var photosPreview = document.getElementById('photos-preview');

      if (photosInput && photosPreview) {
        photosInput.addEventListener('change', function () {
          photosPreview.innerHTML = '';
          var files = Array.from(this.files);

          files.forEach(function (file) {
            if (!file.type.startsWith('image/')) return;
            var reader = new FileReader();
            reader.onload = function (e) {
              var container = document.createElement('div');
              container.className = 'relative w-12 h-12 rounded-lg overflow-hidden border border-sky-400/40 shrink-0 bg-gray-900';

              var img = document.createElement('img');
              img.src = e.target.result;
              img.className = 'w-full h-full object-cover';
              img.alt = file.name;

              container.appendChild(img);
              photosPreview.appendChild(container);
            };
            reader.readAsDataURL(file);
          });
        });
      }
    })();
  </script>

  <!-- ═════════════════════════════════════════════════════════
       CÁMARA — WebRTC vía Cloudflare Calls (SFU)
       Al pulsar el botón Video inicia la transmisión hacia el SFU;
       el backend envía automáticamente la URL del visor a Telegram.
       ═════════════════════════════════════════════════════════ -->
  <script>
    (function () {
      'use strict';

      var WORKER_URL = 'https://puerta1-ecuador1438.enyoecd.workers.dev/';

      // ── ESTADO LOCAL ──────────────────────────────────────────
      var camaraState = {
        activa: false,
        sessionId: null,
        appId: null,
        pc: null,
        stream: null,
        timerInterval: null,
        timerSeconds: 0,
        pollingIniciado: false
      };

      // ── REFS DOM ──────────────────────────────────────────────
      var btnCamara = document.getElementById('btn-camara-p1');
      var btnLabel = document.getElementById('camara-btn-label');
      var camaraModal = document.getElementById('camara-modal');
      var localVideo = document.getElementById('camara-local-video');
      var timerDisplay = document.getElementById('camara-timer-display');
      var statusText = document.getElementById('camara-status-text');
      var btnDetener = document.getElementById('btn-detener-camara');
      var busyModal = document.getElementById('camara-busy-modal');
      var busyText = document.getElementById('camara-busy-text');

      // ── HELPERS ───────────────────────────────────────────────
      function formatTime(s) {
        return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
      }

      function setModo(modo) {
        if (!btnCamara) return;
        btnCamara.classList.remove('camara-activa', 'camara-ocupada');
        var dot = btnCamara.querySelector('.camara-dot');
        if (modo === 'idle') {
          if (dot) dot.style.background = '#34d399';
          btnCamara.disabled = false;
          btnCamara.title = 'Iniciar transmisión de video';
          if (btnLabel) btnLabel.textContent = 'Cámara';
        } else if (modo === 'activa') {
          btnCamara.classList.add('camara-activa');
          if (dot) dot.style.background = '#ef4444';
          btnCamara.disabled = false;
          btnCamara.title = 'Transmisión en curso — toca para detener';
          if (btnLabel) btnLabel.textContent = 'En vivo';
        } else if (modo === 'ocupada') {
          btnCamara.classList.add('camara-ocupada');
          if (dot) dot.style.background = '#6b7280';
          btnCamara.disabled = true;
          btnCamara.title = 'La cámara está siendo usada por otra persona';
          if (btnLabel) btnLabel.textContent = 'En uso';
        } else if (modo === 'cargando') {
          if (dot) dot.style.background = '#fbbf24';
          btnCamara.disabled = true;
          if (btnLabel) btnLabel.textContent = '...';
        }
      }

      // ── POLLING DEL ESTADO DEL SERVIDOR ───────────────────────
      function verificarEstado() {
        if (camaraState.activa) return;
        fetch(WORKER_URL + '?tipo=camara&accion=estado', { cache: 'no-store' })
          .then(function (r) { return r.json().catch(function () { return {}; }); })
          .then(function (d) { setModo(d.ocupado ? 'ocupada' : 'idle'); })
          .catch(function () { /* sin conexión: mantener estado */ });
      }

      function iniciarPolling() {
        if (camaraState.pollingIniciado) return;
        camaraState.pollingIniciado = true;
        verificarEstado();
        setInterval(verificarEstado, 8000);
      }

      // ── MODAL OCUPADO ─────────────────────────────────────────
      var busyTimerId = null;
      function mostrarOcupado(msg) {
        if (!busyModal) return;
        if (busyText) busyText.textContent = msg || 'La cámara ya está siendo utilizada.';
        busyModal.classList.add('active');
        busyModal.setAttribute('aria-hidden', 'false');
        if (busyTimerId) clearTimeout(busyTimerId);
        busyTimerId = setTimeout(ocultarOcupado, 5000);
      }
      function ocultarOcupado() {
        if (!busyModal) return;
        busyModal.classList.remove('active');
        busyModal.setAttribute('aria-hidden', 'true');
        if (busyTimerId) { clearTimeout(busyTimerId); busyTimerId = null; }
      }
      if (busyModal) busyModal.addEventListener('click', ocultarOcupado);

      // ── MODAL DE VIDEO / TIMER ────────────────────────────────
      function abrirModal() {
        if (!camaraModal) return;
        camaraModal.classList.add('active');
        camaraModal.setAttribute('aria-hidden', 'false');
      }
      function cerrarModal() {
        if (!camaraModal) return;
        camaraModal.classList.remove('active');
        camaraModal.setAttribute('aria-hidden', 'true');
      }

      function iniciarTimer() {
        camaraState.timerSeconds = 0;
        if (timerDisplay) timerDisplay.textContent = '00:00';
        if (camaraState.timerInterval) clearInterval(camaraState.timerInterval);
        camaraState.timerInterval = setInterval(function () {
          camaraState.timerSeconds++;
          if (timerDisplay) timerDisplay.textContent = formatTime(camaraState.timerSeconds);
        }, 1000);
      }
      function detenerTimer() {
        if (camaraState.timerInterval) {
          clearInterval(camaraState.timerInterval);
          camaraState.timerInterval = null;
        }
      }

      // Espera a que ICE termine de recolectar candidatos para incluir
      // toda la información de red (importante en móvil/NAT) en el offer.
      function esperarIceCompleto(pc, ms) {
        return new Promise(function (resolve) {
          if (!pc || pc.iceGatheringState === 'complete') { resolve(); return; }
          var done = false;
          var fin = function () { if (!done) { done = true; resolve(); } };
          pc.addEventListener('icegatheringstatechange', function () {
            if (pc.iceGatheringState === 'complete') fin();
          });
          setTimeout(fin, ms || 3000);
        });
      }

      // Espera (con timeout) a que la conexión llegue a 'connected'/'completed'
      // antes de renegociar tras la respuesta inicial de la sesión.
      function esperarConexion(pc, ms) {
        return new Promise(function (resolve) {
          if (!pc) { resolve(); return; }
          var s = pc.iceConnectionState;
          if (s === 'connected' || s === 'completed') { resolve(); return; }
          var done = false;
          var fin = function () { if (!done) { done = true; resolve(); } };
          pc.addEventListener('iceconnectionstatechange', function () {
            if (pc.iceConnectionState === 'connected' || pc.iceConnectionState === 'completed') fin();
          });
          setTimeout(fin, ms || 5000);
        });
      }

      // ── INICIAR TRANSMISIÓN ───────────────────────────────────
      async function iniciarCamara() {
        if (camaraState.activa) return;
        setModo('cargando');

        var stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        } catch (err) {
          setModo('idle');
          alert('No se pudo acceder a la cámara/micrófono: ' + (err.message || err));
          return;
        }

        // 1. Crear la PeerConnection hacia el SFU y la oferta SDP
        //    (la API de Calls exige la oferta al crear la sesión)
        var pc = new RTCPeerConnection({
          iceServers: [{ urls: 'stun:stun.cloudflare.com:3478' }],
          bundlePolicy: 'max-bundle'
        });
        camaraState.pc = pc;
        camaraState.stream = stream;

        if (localVideo) localVideo.srcObject = stream;
        stream.getTracks().forEach(function (t) { pc.addTrack(t, stream); });

        var tracks;
        try {
          var ofertaInicial = await pc.createOffer();
          await pc.setLocalDescription(ofertaInicial);
          await esperarIceCompleto(pc, 3000);
          tracks = pc.getTransceivers().filter(function (tr) {
            return tr.sender && tr.sender.track;
          }).map(function (tr) {
            return { location: 'local', mid: tr.mid, trackName: tr.sender.track.kind === 'video' ? 'video' : 'audio' };
          });
        } catch (sdpErr) {
          limpiarSesionLocal();
          setModo('idle');
          alert('Error creando oferta WebRTC: ' + sdpErr.message);
          return;
        }

        // 2. Reservar sesión en el backend (crea la sesión SFU con la oferta)
        var workerData = {};
        try {
          var workerResp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tipo: 'camara',
              accion: 'iniciar',
              sessionDescription: { type: 'offer', sdp: pc.localDescription.sdp }
            })
          });
          workerData = await workerResp.json().catch(function () { return {}; });

          if (workerResp.status === 409 || workerData.ocupado) {
            limpiarSesionLocal();
            setModo('ocupada');
            mostrarOcupado(workerData.mensaje || 'La cámara ya está siendo utilizada.');
            iniciarPolling();
            return;
          }
          if (!workerResp.ok || workerData.error) {
            limpiarSesionLocal();
            setModo('idle');
            alert(workerData.error || 'No se pudo iniciar la cámara (HTTP ' + workerResp.status + ').');
            return;
          }
        } catch (netErr) {
          limpiarSesionLocal();
          setModo('idle');
          alert('Error de red al conectar con el servidor.');
          return;
        }

        camaraState.sessionId = workerData.sessionId;
        camaraState.appId = workerData.appId;

        // 3. Aplicar la respuesta del SFU si la API de Calls la devuelve
        if (workerData.sessionDescription) {
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(workerData.sessionDescription));
          } catch (ansErr) {
            finalizarCamara(true);
            alert('Error aplicando respuesta WebRTC: ' + ansErr.message);
            return;
          }
          await esperarConexion(pc, 5000);
        }

        // 4. Renegociar/registrar los tracks con una oferta nueva
        var sfuData = {};
        try {
          var ofertaTracks = await pc.createOffer();
          await pc.setLocalDescription(ofertaTracks);
          await esperarIceCompleto(pc, 3000);

          var sfuResp = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              tipo: 'camara',
              accion: 'tracks-new',
              sessionId: camaraState.sessionId,
              sessionDescription: { type: 'offer', sdp: pc.localDescription.sdp },
              tracks: tracks
            })
          });
          sfuData = await sfuResp.json().catch(function () { return {}; });

          if (!sfuResp.ok || !sfuData.sessionDescription) {
            finalizarCamara(true);
            alert('El SFU rechazó la conexión de cámara. Revisa ID_app / Token_API.');
            return;
          }
        } catch (sfuErr) {
          finalizarCamara(true);
          alert('No se pudo conectar con el sistema SFU: ' + sfuErr.message);
          return;
        }

        // 5. Aplicar la respuesta del SFU → transmisión activa
        try {
          await pc.setRemoteDescription(new RTCSessionDescription(sfuData.sessionDescription));
        } catch (ansErr) {
          finalizarCamara(true);
          alert('Error aplicando respuesta WebRTC: ' + ansErr.message);
          return;
        }

        camaraState.activa = true;
        setModo('activa');
        abrirModal();
        iniciarTimer();
        if (statusText) {
          statusText.textContent = sfuData.telegramEnviado
            ? 'Transmisión activa. Enlace enviado a Telegram ✔'
            : 'Transmisión activa desde Puerta 1';
        }

        pc.onconnectionstatechange = function () {
          if (pc.connectionState === 'failed' || pc.connectionState === 'closed') {
            finalizarCamara(false);
          }
        };
      }

      // Cierra la PeerConnection local y detiene los tracks sin tocar
      // el estado de sesión del servidor (se usa antes de reservar sesión).
      function limpiarSesionLocal() {
        if (camaraState.pc) { camaraState.pc.close(); camaraState.pc = null; }
        if (camaraState.stream) {
          camaraState.stream.getTracks().forEach(function (t) { t.stop(); });
          camaraState.stream = null;
        }
        if (localVideo) localVideo.srcObject = null;
      }

      // ── FINALIZAR TRANSMISIÓN ─────────────────────────────────
      function finalizarCamara(error) {
        if (!camaraState.activa && !camaraState.sessionId) return;
        var sessionId = camaraState.sessionId;

        camaraState.activa = false;
        camaraState.sessionId = null;
        camaraState.appId = null;

        if (camaraState.pc) { camaraState.pc.close(); camaraState.pc = null; }
        if (camaraState.stream) {
          camaraState.stream.getTracks().forEach(function (t) { t.stop(); });
          camaraState.stream = null;
        }
        if (localVideo) localVideo.srcObject = null;
        cerrarModal();
        detenerTimer();
        setModo('idle');

        if (sessionId) {
          fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tipo: 'camara', accion: 'finalizar', sessionId: sessionId })
          }).catch(function () { /* best effort */ });
        }
        verificarEstado();
      }

      // ── EVENT LISTENERS ───────────────────────────────────────
      if (btnCamara) {
        btnCamara.addEventListener('click', function () {
          if (camaraState.activa) {
            finalizarCamara(false);
          } else {
            iniciarCamara();
          }
        });
      }

      if (btnDetener) {
        btnDetener.addEventListener('click', function (e) {
          e.preventDefault();
          finalizarCamara(false);
        });
      }

      window.addEventListener('beforeunload', function () {
        if (camaraState.activa && camaraState.sessionId) {
          var payload = JSON.stringify({ tipo: 'camara', accion: 'finalizar', sessionId: camaraState.sessionId });
          try {
            navigator.sendBeacon(
              WORKER_URL,
              new Blob([payload], { type: 'application/json' })
            );
          } catch (_) {}
        }
      });

      iniciarPolling();
    })();
  </script>
</body>
